<style>
/* margini pentru telefoanele cu decupaj, cand jocul ruleaza ca aplicatie */
@media (orientation:landscape) and (pointer:coarse){
  body{
    padding-left:max(2px, env(safe-area-inset-left));
    padding-right:max(2px, env(safe-area-inset-right));
  }
}
/* sfatul de instalare pe iPhone — apare doar in Safari, nu si in aplicatie */
#instaleaza{
  display:none; align-items:center; gap:10px;
  font-family:'Nunito',system-ui,sans-serif; font-size:13px; line-height:1.35;
  background:#FFF7EC; border:2.5px solid #2E2438; border-radius:14px;
  padding:9px 12px; max-width:min(94vw,460px); box-shadow:0 3px 0 0 #2E2438;
}
#instaleaza b{font-family:'Fredoka',sans-serif}
#instaleaza button{
  margin-left:auto; flex:none; border:2px solid #2E2438; border-radius:999px;
  background:#FFC93C; font:inherit; font-weight:700; padding:4px 12px; cursor:pointer;
}

<title>Aventura Anabellei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#2E2438;
  --ink-soft:rgba(46,36,56,.55);
  --bg:#FDF3E3;
  --paper:#FFF7EC;
  --paper-2:#F7E4CC;
  --mint:#BFE7DE;
  --coin:#FFC93C;
  --coin-dark:#E39B12;
  --rose:#F58BB0;
  --grape:#7B5CD6;
  --danger:#E5566A;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  background-image:radial-gradient(circle at 18% 12%, #FFE7C4 0%, transparent 45%),
                   radial-gradient(circle at 84% 82%, #E7DCF6 0%, transparent 50%);
  color:var(--ink);
  font-family:'Nunito',ui-rounded,system-ui,sans-serif;
  min-height:100vh; min-height:100dvh;
  display:grid; place-items:center;
  padding:clamp(8px,2vw,22px);
}

.shell{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}

.stage{
  position:relative;
  width:min(100%, calc((100dvh - 128px) * 16 / 9));
  aspect-ratio:16/9;
  container-type:size;
  border:3px solid var(--ink);
  border-radius:18px;
  overflow:hidden;
  background:var(--mint);
  box-shadow:0 12px 0 -3px rgba(46,36,56,.16), 0 30px 54px -20px rgba(46,36,56,.5);
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%}

/* ---------- overlay panels ---------- */
.panel{
  position:absolute; inset:0;
  display:grid; place-items:center;
  padding:3cqw;
  background:rgba(46,36,56,.58);
  backdrop-filter:blur(3px);
  z-index:5;
}
.panel[hidden]{display:none}

.card{
  position:relative;
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:18px;
  padding:3.4cqw 3.8cqw;
  width:min(86cqw, 100%);
  max-height:92cqh;
  overflow:auto;
  text-align:center;
  box-shadow:0 7px 0 -1px rgba(46,36,56,.28);
}
/* stitch line — the tailor motif */
.card::after{
  content:'';position:absolute;inset:1.1cqw;
  border:2px dashed rgba(46,36,56,.3);
  border-radius:11px;pointer-events:none;
}
.card > *{position:relative;z-index:1}

h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(22px,5.6cqw,54px);line-height:1.02;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(19px,4cqw,40px);line-height:1.05;text-wrap:balance}
.eyebrow{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(10px,1.7cqw,15px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--grape);margin-bottom:.7cqw;
}
.lead{font-size:clamp(12px,2.15cqw,20px);line-height:1.45;max-width:min(52cqw,50ch);margin:1.4cqw auto 0;color:#4A3D57}
.tiny{font-size:clamp(10px,1.7cqw,15px);color:#6B5C78;margin-top:1.4cqw;line-height:1.5}

.keys{display:flex;flex-wrap:wrap;gap:1cqw;justify-content:center;margin:2.2cqw 0 .4cqw}
.key{
  font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(10px,1.75cqw,16px);
  background:var(--paper-2);border:2.5px solid var(--ink);border-radius:9px;
  padding:.7cqw 1.5cqw;box-shadow:0 3px 0 0 var(--ink);
}

.btn{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(14px,2.6cqw,26px);
  padding:clamp(7px,1.1cqw,14px) clamp(16px,3cqw,34px);
  margin-top:2.4cqw;
  border-radius:999px;
  border:3px solid var(--ink);
  background:var(--coin);
  color:var(--ink);
  cursor:pointer;
  box-shadow:0 5px 0 0 var(--ink);
  transition:transform .06s ease, box-shadow .06s ease;
}
.btn:hover{background:#FFD968}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--grape);outline-offset:4px}
.btn.ghost{background:var(--paper-2)}

/* ---------- shop ---------- */
.purse{
  display:inline-flex;align-items:center;gap:.7cqw;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(13px,2.4cqw,23px);
  background:var(--paper-2);border:2.5px solid var(--ink);border-radius:999px;
  padding:.5cqw 1.8cqw;margin-top:1.4cqw;
}
.purse b{font-variant-numeric:tabular-nums}
.coin-ico{width:1em;height:1em;vertical-align:-.15em;flex:none}

.items{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(84px,15cqw,150px),1fr));
  gap:1.5cqw;
  margin:2.2cqw 0 .6cqw;
}
.item{
  background:var(--paper-2);
  border:2.5px solid var(--ink);
  border-radius:13px;
  padding:1.1cqw .8cqw 1.3cqw;
  display:flex;flex-direction:column;align-items:center;gap:.5cqw;
  cursor:pointer;font:inherit;color:inherit;
  transition:transform .08s ease;
}
.item:hover{transform:translateY(-3px)}
.item:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.item canvas{width:clamp(48px,9cqw,96px);height:clamp(59px,11cqw,118px)}
.item .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(10px,1.75cqw,16px);line-height:1.15;text-wrap:balance}
.item .pr{font-size:clamp(10px,1.6cqw,15px);font-weight:700;color:var(--coin-dark);font-variant-numeric:tabular-nums}
.item[data-state="worn"]{background:var(--mint);box-shadow:inset 0 0 0 3px var(--grape)}
.item[data-state="worn"] .pr{color:var(--grape)}
.item[data-state="locked"]{opacity:.45;cursor:not-allowed}
.item[data-state="locked"]:hover{transform:none}

.section-label{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(12px,2.1cqw,20px);
  margin-top:1.6cqw;text-align:left;padding-left:.4cqw;
}

/* ---------- alegerea nivelului ---------- */
.levels{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(100px,17cqw,164px),1fr));
  gap:1.2cqw;
  margin:2cqw 0 .6cqw;
}
.lvl{
  background:var(--paper-2);
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:1cqw .7cqw 1.1cqw;
  display:flex;flex-direction:column;align-items:center;gap:.3cqw;
  cursor:pointer;font:inherit;color:inherit;text-align:center;
  transition:transform .08s ease;
}
.lvl:hover{transform:translateY(-3px);background:var(--mint)}
.lvl:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.lvl .no{
  font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(15px,2.6cqw,25px);line-height:1;
}
.lvl .nm{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(10px,1.6cqw,15px);line-height:1.15;text-wrap:balance}
.lvl .em{font-size:clamp(15px,2.6cqw,26px);line-height:1}

@media (orientation:portrait) and (pointer:coarse){
  .panel .levels{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0 4px}
  .panel .lvl{padding:8px 5px 9px}
  .panel .lvl .no{font-size:17px}
  .panel .lvl .nm{font-size:11px}
  .panel .lvl .em{font-size:18px}
}

/* ---------- touch pad ---------- */
.pad{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;padding:clamp(8px,2.2cqw,22px) clamp(10px,2.6cqw,26px);z-index:4;pointer-events:none}
.pad.on{display:flex}
.pad .grp{display:flex;gap:clamp(8px,1.6cqw,16px)}
.pad button{
  pointer-events:auto;
  width:clamp(52px,11cqw,88px);height:clamp(52px,11cqw,88px);border-radius:50%;
  border:3px solid var(--ink);background:rgba(255,247,236,.72);
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(18px,3.4cqw,32px);color:var(--ink);
  box-shadow:0 4px 0 0 var(--ink);
}
.pad button:active{transform:translateY(4px);box-shadow:none;background:var(--coin)}

/* ---------- footer bar ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.bar button{
  font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px;
  border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);
  color:var(--ink);padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 0 var(--ink);
}
.bar button:active{transform:translateY(3px);box-shadow:none}
.bar button:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.bar .note{font-size:13px;color:#6B5C78}

@media (max-width:820px){
  body{padding:6px}
  .shell{gap:8px}
  .stage{width:100%}
  .bar .note{display:none}
  .bar button{font-size:13px;padding:5px 14px}
  .card{padding:14px 12px;width:min(94cqw,100%)}
  .card::after{inset:6px}
  .items{gap:8px;margin:12px 0 4px}
}

/* pe atingere, indiciile de tastatura nu ajuta pe nimeni */
@media (pointer:coarse){
  .bar .note{display:none}
  .bar button{font-size:12px;padding:4px 12px}
}

/* telefon culcat: dam jocului aproape tot ecranul */
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
  body{padding:2px}
  .shell{gap:3px}
  .stage{width:min(100%, calc((100dvh - 36px) * 16 / 9))}
  .bar{gap:6px}
  .pad button{width:clamp(44px,10cqw,84px);height:clamp(44px,10cqw,84px)}
}

/* telefon in picioare: il rugam sa il intoarca */
.rotate{display:none;justify-content:center}
.rotate span{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;
  background:var(--coin);border:2.5px solid var(--ink);border-radius:999px;
  padding:6px 16px;box-shadow:0 3px 0 0 var(--ink);
}

@media (orientation:portrait) and (pointer:coarse){
  .rotate{display:flex}
  .pad button{width:clamp(50px,13cqw,66px);height:clamp(50px,13cqw,66px);font-size:22px}

  /* Pe ecran ingust panoul iese din scena si ocupa tot telefonul,
     altfel butonul principal ramane sub taietura. */
  .panel{position:fixed;inset:0;z-index:20;padding:12px}
  .card{width:min(96vw,540px);max-height:88dvh;padding:18px 15px}
  .card::after{inset:8px}
  .panel h1{font-size:clamp(24px,7.4vw,36px)}
  .panel h2{font-size:clamp(20px,6vw,30px)}
  .panel .eyebrow{font-size:12px}
  .panel .lead{font-size:clamp(14px,4vw,17px);max-width:none;margin-top:10px}
  .panel .tiny{font-size:12px}
  .panel .keys{gap:7px;margin:14px 0 2px}
  .panel .key{font-size:12px;padding:6px 12px}
  .panel .btn{font-size:clamp(16px,4.8vw,21px);padding:13px 28px;margin-top:16px}
  .panel .purse{font-size:clamp(15px,4.4vw,19px);padding:6px 16px;gap:7px}
  .panel .section-label{font-size:15px;margin-top:12px}
  .panel .items{grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px;margin:14px 0 4px}
  .panel .item{padding:9px 6px 10px;gap:5px}
  .panel .item canvas{width:64px;height:79px}
  .panel .item .nm{font-size:12px}
  .panel .item .pr{font-size:12px}
  #fin-prev{width:150px !important;height:184px !important}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>

<div class="shell">
  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="540" aria-label="Joc: Aventura Anabellei"></canvas>

    <div class="pad" id="pad">
      <div class="grp">
        <button id="bl" aria-label="Stânga">◀</button>
        <button id="br" aria-label="Dreapta">▶</button>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   Aventura Anabellei — un platformer de doua niveluri.
   Nivel 1: supermarket -> croitorie.  Nivel 2: galerie -> salon.
   ============================================================ */

const cv = document.getElementById('cv');
const g  = cv.getContext('2d');
const W = 960, H = 540;

const INK    = '#2E2438';
const COIN   = '#FFC93C';
const COIND  = '#E39B12';
const DANGER = '#E5566A';
const SKIN   = '#F7D2B5';
const SKIN_D = '#E0B394';

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

/* ---------------- sunet ---------------- */
let actx = null, muted = false;
function beep(freq, dur, type, vol, delay){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    gn.gain.setValueAtTime(vol || 0.05, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
const sfx = {
  coin(){ beep(920,.07,'square',.045,0); beep(1380,.09,'square',.04,.06); },
  jump(){ beep(430,.11,'triangle',.05,0); beep(640,.08,'triangle',.035,.05); },
  hurt(){ beep(200,.22,'sawtooth',.05,0); beep(130,.26,'sawtooth',.04,.09); },
  stomp(){ beep(300,.07,'square',.05,0); beep(760,.1,'square',.04,.05); },
  buy(){ beep(660,.09,'triangle',.05,0); beep(880,.09,'triangle',.05,.08); beep(1180,.16,'triangle',.05,.16); },
  win(){ [523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',.055,i*.11)); },
  jump2(){ beep(560,.1,'triangle',.05,0); beep(840,.1,'triangle',.04,.06); },
  fire(){ beep(720,.06,'sawtooth',.035,0); beep(420,.09,'sawtooth',.03,.05); },
  power(){ [392,523,659,784,1047].forEach((f,i)=>beep(f,.13,'square',.05,i*.07)); }
};

/* ---------------- garderoba ---------------- */
const OUTFITS = [
  { id:'rupta',    name:'Rochiță ruptă',    price:0,  dress:'#A2907C', trim:'#83725F', torn:true },
  { id:'roz',      name:'Rochiță roz',      price:15, dress:'#F58BB0', trim:'#FFD9E7' },
  { id:'curcubeu', name:'Rochiță curcubeu', price:30, rainbow:true,    trim:'#FFFFFF' },
  { id:'printesa', name:'Rochie de prințesă',price:50, dress:'#7B5CD6', trim:'#FFC93C', sparkle:true }
];
const HAIRS = [
  { id:'ciufulit', name:'Păr ciufulit', price:0,  color:'#6B4A32' },
  { id:'coditse',  name:'Codițe',       price:15, color:'#6B4A32' },
  { id:'coc',      name:'Coc cu fundă', price:25, color:'#4E3524' },
  { id:'bucle',    name:'Bucle aurii',  price:40, color:'#EFC152' }
];
const WINGS = [
  { id:'transparente', name:'Aripi de zână',  price:0,  a:'rgba(255,255,255,.8)',  b:'#8FD3C6' },
  { id:'roz',          name:'Aripi roz',      price:15, a:'rgba(245,139,176,.82)', b:'#E0679A' },
  { id:'curcubeu',     name:'Aripi curcubeu', price:30, rainbow:true,              b:'#7B5CD6' },
  { id:'aurii',        name:'Aripi aurii',    price:45, a:'rgba(255,201,60,.86)',  b:'#E39B12' }
];
const PIGS = [
  { id:'porcRoz',      name:'Porc roz',      price:0,  a:'#F5A3B8', b:'#DE7E97' },
  { id:'porcPatat',    name:'Porc pătat',    price:15, a:'#F9DCE3', b:'#C98BA0', spots:true },
  { id:'porcCurcubeu', name:'Porc curcubeu', price:30, rainbow:true, b:'#8B6FD6' },
  { id:'porcAuriu',    name:'Porc auriu',    price:45, a:'#FFD447', b:'#E39B12' }
];
/* Armele din dulce — alese la capatul lumii dulciurilor, pentru monstrii
   din aventurile urmatoare (cerut de Anabelle, 2026-08-20). */
const ARME = [
  { id:'acadea', name:'Baghetă-acadea',       price:0,  a:'#F58BB0', b:'#FFF7EC' },
  { id:'sabie',  name:'Sabie de turtă dulce', price:20, a:'#C6813F', b:'#FFE9C9' },
  { id:'bici',    name:'Bici de jeleu',        price:25, a:'#E5566A', b:'#FFB0C2' },
  { id:'prastie', name:'Praștie cu bomboane',  price:30, a:'#8A6242', b:'#5FC98B' },
  { id:'ciocan',  name:'Ciocan de ciocolată',  price:35, a:'#5E4130', b:'#8E6444' },
  { id:'gheata',  name:'Sabie de zahăr candel',price:40, a:'#BFE7F5', b:'#FFFFFF' },
  { id:'arc',     name:'Arc de vată de zahăr', price:50, a:'#8FD3C6', b:'#F5A3B8' }
];
const MAKEUPS = [
  { id:'none',     name:'Fără machiaj',   price:0 },
  { id:'obraji',   name:'Obrăjori roz',   price:10 },
  { id:'sclipici', name:'Sclipici pe ochi',price:20 }
];
const byId = (arr,id) => arr.find(o => o.id === id) || arr[0];

/* ---------------- desenul fetitei ----------------
   Anabelle vrea sa se vada fata fetitei, nu profilul ei (cerut 2026-08-20,
   dupa ce a vazut profilul). Desenul din profil ramane in drawGirl si se
   aprinde de aici, daca se razgandeste. */
const PROFIL_IN_JOC = false;

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function fs(c,fill){ c.fillStyle = fill; c.fill(); c.strokeStyle = INK; c.stroke(); }

/* Arma din dulce, tinuta in mana. Aceleasi coordonate ca torta si pizza. */
function drawArma(c, id, o){
  const w = byId(ARME, id);
  const leg = (o && o.legs) || 0;
  c.save(); c.translate(15, -30);
  c.lineWidth = 1.8; c.strokeStyle = INK; c.lineJoin = 'round';
  if(id === 'sabie'){
    c.rotate(-0.62);
    rr(c, -3, -30, 6, 30, 3); c.fillStyle = w.a; c.fill(); c.stroke();      /* lama */
    rr(c, -8, -2, 16, 5, 2.5); c.fillStyle = '#E39B12'; c.fill(); c.stroke(); /* garda */
    rr(c, -2.6, 3, 5.2, 11, 2.6); c.fillStyle = '#8A6242'; c.fill(); c.stroke();
    c.strokeStyle = w.b; c.lineWidth = 1.6;                                 /* glazura */
    c.beginPath(); c.moveTo(0,-27); c.lineTo(0,-4); c.stroke();
  }else if(id === 'ciocan'){
    c.rotate(-0.5);
    rr(c, -2.6, -16, 5.2, 30, 2.6); c.fillStyle = '#8A6242'; c.fill(); c.stroke();
    rr(c, -11, -26, 22, 13, 4); c.fillStyle = w.a; c.fill(); c.stroke();
    rr(c, -8, -24, 16, 4, 2); c.fillStyle = w.b; c.fill();
  }else if(id === 'gheata'){
    /* sabie de zahar candel: se vede prin ea si sclipeste */
    c.rotate(-0.62);
    c.beginPath();
    c.moveTo(-3.4, 0); c.lineTo(-2.4, -28); c.lineTo(0, -33); c.lineTo(2.4, -28); c.lineTo(3.4, 0);
    c.closePath(); c.fillStyle = w.a; c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.85)';
    c.beginPath(); c.moveTo(-1.2,-27); c.lineTo(0.6,-27); c.lineTo(0.6,-3); c.lineTo(-1.2,-3);
    c.closePath(); c.fill();
    rr(c, -8, -2, 16, 5, 2.5); c.fillStyle = '#BFE7DE'; c.fill(); c.stroke();
    rr(c, -2.6, 3, 5.2, 11, 2.6); c.fillStyle = '#7FA8C9'; c.fill(); c.stroke();
    c.fillStyle = '#FFF7EC';
    sparkle(c, 0.5, -22 + Math.sin(leg*2)*4, 3.2);
  }else if(id === 'bici'){
    /* bici de jeleu: un lant de bomboane care flutura dupa ea */
    rr(c, -2.6, -4, 5.2, 15, 2.6); c.fillStyle = '#8A6242'; c.fill(); c.stroke();
    const und = Math.sin(leg * 1.6);
    c.strokeStyle = w.a; c.lineWidth = 3.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -4);
    c.quadraticCurveTo(13, -14 - und*4, 24, -6 + und*5);
    c.quadraticCurveTo(31, -1 + und*7, 34, 6 + und*4);
    c.stroke(); c.lineCap = 'butt';
    for(let i = 1; i <= 4; i++){
      const t = i/4.6, bx = 4 + t*32, by = -6 - und*3 + t*t*16;
      c.beginPath(); c.arc(bx, by, 3.2, 0, 7);
      c.fillStyle = i % 2 ? w.b : '#FFD447'; c.fill();
      c.lineWidth = 1.3; c.strokeStyle = INK; c.stroke();
    }
  }else if(id === 'prastie'){
    /* prastie: furca de lemn, elastic de jeleu, o bomboana in ea */
    c.rotate(-0.28);
    c.lineWidth = 3.2; c.strokeStyle = w.a; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 12); c.lineTo(0, -6);
    c.moveTo(0, -6); c.lineTo(-7, -20);
    c.moveTo(0, -6); c.lineTo(7, -20);
    c.stroke();
    c.strokeStyle = INK; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(0, 12); c.lineTo(0, -6);
    c.moveTo(0, -6); c.lineTo(-7, -20); c.moveTo(0, -6); c.lineTo(7, -20); c.stroke();
    const trage = 3 + Math.abs(Math.sin(leg)) * 3;
    c.strokeStyle = '#E5566A'; c.lineWidth = 1.8; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-7, -20); c.lineTo(0, -12 + trage); c.lineTo(7, -20); c.stroke();
    c.lineCap = 'butt';
    c.beginPath(); c.arc(0, -12 + trage, 4, 0, 7);
    c.fillStyle = w.b; c.fill(); c.lineWidth = 1.4; c.strokeStyle = INK; c.stroke();
  }else if(id === 'arc'){
    c.rotate(-0.2);
    c.strokeStyle = w.b; c.lineWidth = 5;                                   /* vata roz */
    c.beginPath(); c.arc(-2, -12, 15, -1.15, 1.15); c.stroke();
    c.strokeStyle = INK; c.lineWidth = 1.4;
    c.beginPath(); c.arc(-2, -12, 15, -1.15, 1.15); c.stroke();
    c.strokeStyle = w.a; c.lineWidth = 1.6;                                 /* coarda */
    c.beginPath(); c.moveTo(4, -25.6); c.lineTo(4, 1.6); c.stroke();
  }else{
    /* bagheta-acadea: un baton alb cu o spirala roz in varf */
    rr(c, -2.2, -14, 4.4, 26, 2.2); c.fillStyle = '#FFF7EC'; c.fill(); c.stroke();
    c.save(); c.translate(0, -20); c.rotate(leg * 0.5);
    c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fillStyle = w.b; c.fill(); c.stroke();
    c.strokeStyle = w.a; c.lineWidth = 2.6; c.lineCap = 'round';
    c.beginPath();
    for(let i = 0; i <= 26; i++){
      const t = i / 26 * 4.4, r = 1 + t * 1.75;
      i ? c.lineTo(Math.cos(t)*r, Math.sin(t)*r) : c.moveTo(Math.cos(t)*r, Math.sin(t)*r);
    }
    c.stroke(); c.lineCap = 'butt';
    c.restore();
  }
  c.restore(); c.lineWidth = 2.2; c.strokeStyle = INK;
}

/* Deseneaza fetita cu picioarele la (0,0), inaltime ~62.  */
function drawGirl(c, look, o){
  o = o || {};
  const legs   = o.legs   || 0;
  const face   = o.face   || 1;
  const scale  = o.scale  || 1;
  const arms   = o.arms   || 0;
  const mood   = o.mood   || 'ok';   /* ok · wow · ouch · somn */
  const squash = o.squash || 0;      /* 1 = turtita la aterizare */
  const blink  = !!o.blink;
  const side   = !!o.side;           /* din profil, cum alearga in joc */
  const outfit = byId(OUTFITS, look.outfit);
  const hair   = byId(HAIRS,   look.hair);
  const mk     = look.makeup || 'none';

  c.save();
  c.translate(o.x||0, o.y||0);
  /* turtirea se face din talpi in sus, ca la desene animate */
  c.scale(face*scale*(1 + squash*0.22), scale*(1 - squash*0.26));
  c.lineWidth = 2.2; c.lineJoin = 'round'; c.lineCap = 'round';

  const lp = Math.sin(legs) * 6;

  /* --- aripi de zana (in spatele fetitei) --- */
  if(look.fairy){
    const wg = byId(WINGS, look.wings);
    const flap = Math.sin((o.wing !== undefined ? o.wing : legs) * 2) * 0.28;
    for(const sx of [-1, 1]){
      c.save();
      if(side){
        /* amandoua in spatele ei, una peste alta, ca sa nu iasa prin piept */
        c.translate(-7, -38 + sx * 3);
        c.rotate(-(0.30 + flap) + sx * 0.30);
        c.scale(-1, 1);
      }else{
        c.translate(sx * 6, -36); c.rotate(sx * (0.42 + flap));
      }
      for(const sc of [1, 0.68]){
        c.save(); c.scale(sx * sc, sc);
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(4, -22, 24, -26, 26, -8);
        c.bezierCurveTo(27, 5, 10, 8, 0, 0);
        c.closePath();
        if(wg.rainbow){
          const wgr = c.createLinearGradient(0,-24,26,6);
          ['rgba(242,84,91,.7)','rgba(255,212,71,.7)','rgba(95,201,139,.7)','rgba(139,111,214,.7)']
            .forEach((col,i)=>wgr.addColorStop(i/3,col));
          c.fillStyle = wgr;
        }else c.fillStyle = wg.a;
        c.fill();
        c.lineWidth = 1.8 / sc; c.strokeStyle = wg.b; c.stroke();
        c.restore();
      }
      c.restore();
    }
  }

  /* --- picioare + pantofi --- */
  const pantof = outfit.id === 'rupta' ? '#8C7663' : '#E5566A';
  if(side){
    /* din profil picioarele stau unul in spatele altuia si calca mai larg;
       cel din spate e mai inchis la culoare, ca sa se vada care e care */
    for(const s of [{sw:-lp*1.7, piele:SKIN_D, incaltare:'#8C6A55', z:-1.5},
                    {sw: lp*1.7, piele:SKIN,   incaltare:pantof,   z: 1.5}]){
      c.save(); c.translate(s.z, -16); c.rotate(s.sw * 0.055);
      rr(c, -3.2, 0, 6.4, 15, 3); fs(c, s.piele);
      /* pantoful arata inainte, spre unde merge */
      rr(c, -3.4, 12, 11, 6, 3); fs(c, s.incaltare);
      c.restore();
    }
  }else{
    for(const s of [{dx:-5, sw:lp}, {dx:5, sw:-lp}]){
      c.save(); c.translate(s.dx, -16); c.rotate(s.sw * 0.035);
      rr(c, -3.4, 0, 6.8, 15, 3); fs(c, SKIN);
      rr(c, -5.2, 12, 10.4, 6, 3); fs(c, pantof);
      c.restore();
    }
  }

  /* --- rochie --- */
  c.beginPath();
  if(side){
    /* din profil rochia e mai ingusta si zboara putin in spate cand alearga */
    const flutur = Math.min(Math.abs(o.speed || 0), 5) * 0.9;
    c.moveTo(-6, -40); c.lineTo(7, -40);
    c.lineTo(11, -17);
    if(outfit.torn){
      c.lineTo(8,-13); c.lineTo(4,-19); c.lineTo(0,-12); c.lineTo(-5,-18); c.lineTo(-9,-13);
    }else{
      c.lineTo(9,-14); c.lineTo(-10 - flutur,-15);
    }
    c.lineTo(-11 - flutur, -18);
  }else{
    c.moveTo(-8, -40); c.lineTo(8, -40);
    c.lineTo(15, -17);
    if(outfit.torn){
      c.lineTo(10,-13); c.lineTo(6,-19); c.lineTo(1,-12); c.lineTo(-4,-18); c.lineTo(-9,-12); c.lineTo(-13,-17);
    }else{
      c.lineTo(13,-14); c.lineTo(-13,-14);
    }
    c.lineTo(-15, -17);
  }
  c.closePath();
  if(outfit.rainbow){
    const grd = c.createLinearGradient(0,-40,0,-13);
    ['#F2545B','#F9A03F','#FFD447','#5FC98B','#4FB3D9','#8B6FD6'].forEach((col,i)=>grd.addColorStop(i/5,col));
    c.fillStyle = grd;
  }else{
    c.fillStyle = outfit.dress;
  }
  c.fill(); c.strokeStyle = INK; c.stroke();

  /* petic pe rochia rupta */
  if(outfit.torn){
    c.save(); c.translate(5,-28); c.rotate(.2);
    rr(c,-4,-4,8,8,1.5); c.fillStyle='#C9B49E'; c.fill();
    c.lineWidth=1.2; c.setLineDash([2,2]); c.strokeStyle=INK; c.stroke();
    c.setLineDash([]); c.lineWidth=2.2; c.restore();
  }
  /* guler / betelie */
  if(side) rr(c, -7, -42, 14, 5, 2.5); else rr(c, -9, -42, 18, 5, 2.5);
  fs(c, outfit.trim);
  if(outfit.sparkle){
    c.fillStyle = '#FFF3B0';
    [[-8,-33],[6,-30],[-2,-22],[10,-24]].forEach(p=>{
      c.beginPath();
      c.moveTo(p[0],p[1]-3); c.lineTo(p[0]+1.6,p[1]); c.lineTo(p[0],p[1]+3); c.lineTo(p[0]-1.6,p[1]);
      c.closePath(); c.fill();
    });
  }

  if(o.sup){
    c.save(); c.translate(0, -31); c.rotate(Math.sin((o.legs||0)*2) * 0.12);
    c.beginPath();
    for(let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? 2.6 : 6;
      i ? c.lineTo(Math.cos(a)*r, Math.sin(a)*r) : c.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.fillStyle = '#FFC93C'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.8; c.stroke();
    c.lineWidth = 2.2; c.restore();
  }

  /* --- brate --- */
  const ap = Math.sin(arms) * 5;
  if(side){
    /* unul in spate (mai inchis), unul in fata, amandoua pe aceeasi verticala */
    for(const s of [{sw:-ap*1.8, piele:SKIN_D, z:-2}, {sw:ap*1.8, piele:SKIN, z:2}]){
      c.save(); c.translate(s.z, -39); c.rotate(s.sw * 0.075);
      rr(c, -2.6, 0, 5.2, 15, 2.6); fs(c, s.piele);
      c.restore();
    }
  }else{
    for(const s of [{dx:-10, sw:-ap}, {dx:10, sw:ap}]){
      c.save(); c.translate(s.dx, -40); c.rotate(s.sw * 0.05 + (s.dx<0 ? .18 : -.18));
      rr(c, -2.8, 0, 5.6, 15, 2.8); fs(c, SKIN);
      c.restore();
    }
  }

  /* --- bagheta de zana --- */
  if(look.fairy){
    c.save(); c.translate(13, -30); c.rotate(-0.5);
    c.lineWidth = 2.4; c.strokeStyle = '#FFF7EC';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -15); c.stroke();
    c.strokeStyle = INK; c.lineWidth = 1.4; c.stroke();
    c.translate(0, -18);
    c.beginPath();
    for(let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? 2.2 : 5.4;
      i ? c.lineTo(Math.cos(a)*r, Math.sin(a)*r) : c.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.fillStyle = COIN; c.fill(); c.lineWidth = 1.8; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 2.2; c.restore();
  }

  /* --- pizza pentru cocoși --- */
  if(look.pizza){
    c.save(); c.translate(14, -30); c.rotate(-0.18);
    c.beginPath(); c.ellipse(0, 0, 13, 5.4, 0, 0, 7);
    c.fillStyle = '#F3D08A'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.8; c.stroke();
    c.fillStyle = '#E5566A';
    for(const px of [-7, 0, 7]){
      c.beginPath(); c.ellipse(px, -1.4, 2.6, 1.5, 0, 0, 7); c.fill();
    }
    c.restore(); c.lineWidth = 2.2;
  }

  /* --- arma din dulce --- */
  if(look.arma) drawArma(c, look.arma, o);

  /* --- torța din peșteră --- */
  if(look.torch){
    c.save(); c.translate(-13, -34); c.rotate(0.32);
    rr(c, -2.6, -2, 5.2, 21, 2.6); fs(c, '#8A6242');
    const fl = 1 + Math.sin((o.legs || 0) * 3) * 0.13;
    c.save(); c.scale(fl, fl);
    c.beginPath(); c.moveTo(0,-3); c.quadraticCurveTo(7.5,-10, 0,-23); c.quadraticCurveTo(-7.5,-10, 0,-3);
    c.closePath(); c.fillStyle = '#F2884B'; c.fill(); c.lineWidth = 1.6; c.strokeStyle = INK; c.stroke();
    c.beginPath(); c.moveTo(0,-6); c.quadraticCurveTo(3.6,-10, 0,-17); c.quadraticCurveTo(-3.6,-10, 0,-6);
    c.closePath(); c.fillStyle = '#FFD447'; c.fill();
    c.restore(); c.restore(); c.lineWidth = 2.2;
  }

  /* --- par in spate --- */
  c.fillStyle = hair.color; c.strokeStyle = INK;
  if(side){
    /* din profil tot parul cade in spate, iar coada flutura dupa ea */
    const val = Math.sin((o.legs || 0) * 1.4) * 3;
    if(hair.id === 'bucle'){
      [[-12,-56,6.4],[-15,-47,6],[-13,-38,5.4],[-9,-32,4.6]].forEach(p=>{
        c.beginPath(); c.arc(p[0] - val*0.3, p[1], p[2], 0, 7); c.fill(); c.stroke();
      });
    }else if(hair.id === 'coditse'){
      c.beginPath(); c.moveTo(-8,-56);
      c.quadraticCurveTo(-22 - val, -50, -19 - val, -34);
      c.quadraticCurveTo(-17 - val, -28, -12, -33);
      c.quadraticCurveTo(-14, -44, -6, -52);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(-11,-52,3,0,7); c.fillStyle='#F58BB0'; c.fill(); c.stroke();
      c.fillStyle = hair.color;
    }else if(hair.id === 'coc'){
      c.beginPath(); c.arc(-9,-61,7.5,0,7); c.fill(); c.stroke();
      c.fillStyle = '#F2545B';
      c.beginPath(); c.moveTo(-17,-61); c.lineTo(-11,-64); c.lineTo(-11,-58); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = hair.color;
    }else{
      c.beginPath(); c.moveTo(-4,-58);
      c.quadraticCurveTo(-17 - val, -52, -14 - val, -38);
      c.lineTo(-5,-38);
      c.quadraticCurveTo(-8,-48, -2,-54);
      c.closePath(); c.fill(); c.stroke();
    }
  }else if(hair.id === 'bucle'){
    [[-11,-50,7],[11,-50,7],[-10,-41,6],[10,-41,6],[0,-38,6]].forEach(p=>{
      c.beginPath(); c.arc(p[0],p[1],p[2],0,7); c.fill(); c.stroke();
    });
  }else if(hair.id === 'coditse'){
    for(const sx of [-1,1]){
      c.beginPath(); c.moveTo(sx*11,-53);
      c.quadraticCurveTo(sx*20,-45, sx*16,-32);
      c.quadraticCurveTo(sx*13,-27, sx*9,-31);
      c.quadraticCurveTo(sx*13,-42, sx*8,-51);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(sx*13,-47,3,0,7); c.fillStyle='#F58BB0'; c.fill(); c.stroke();
      c.fillStyle = hair.color;
    }
  }else if(hair.id === 'coc'){
    c.beginPath(); c.arc(0,-64,7.5,0,7); c.fill(); c.stroke();
    c.fillStyle = '#F2545B';
    c.beginPath(); c.moveTo(-8,-64); c.lineTo(-2,-67); c.lineTo(-2,-61); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(8,-64); c.lineTo(2,-67); c.lineTo(2,-61); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hair.color;
  }else{
    /* ciufulit — smocuri dezordonate */
    c.beginPath(); c.moveTo(-11,-48);
    c.quadraticCurveTo(-16,-40,-9,-36);
    c.lineTo(9,-36);
    c.quadraticCurveTo(16,-40,11,-48);
    c.closePath(); c.fill(); c.stroke();
  }

  /* --- cap --- */
  if(side){
    /* profil: obraz rotund, nasucel si barbie inainte */
    c.beginPath();
    c.moveTo(-2, -62.2);
    c.bezierCurveTo(7, -62.5, 10.6, -57, 10.4, -53);   /* fruntea */
    c.lineTo(12.6, -49.6);                              /* nasucul */
    c.lineTo(9.6, -48.2);
    c.bezierCurveTo(10.2, -44, 6, -41.4, 1.6, -41.6);   /* barbia */
    c.bezierCurveTo(-6, -42, -10.5, -46, -10.5, -52);
    c.bezierCurveTo(-10.5, -58, -7, -62, -2, -62.2);
    c.closePath();
    c.fillStyle = SKIN; c.fill(); c.strokeStyle = INK; c.stroke();
    /* urechea */
    c.beginPath(); c.arc(-3.4, -50.6, 2.6, -1.1, 2.1); c.lineWidth = 1.6; c.stroke();
    c.lineWidth = 2.2;
  }else{
    c.beginPath(); c.arc(0,-52,10.5,0,7); c.fillStyle = SKIN; c.fill(); c.strokeStyle = INK; c.stroke();
  }

  /* --- breton --- */
  c.fillStyle = hair.color;
  if(side){
    /* calota de par peste ceafa si crestet, cu un breton care cade spre fata */
    c.beginPath();
    c.moveTo(-10.6,-50);
    c.bezierCurveTo(-11.5,-60, -6,-63.6, -1,-63.4);
    c.bezierCurveTo(6,-63.2, 10.6,-59, 10.6,-53.4);
    c.quadraticCurveTo(7.4,-56.6, 3.4,-55.4);   /* varful bretonului */
    c.quadraticCurveTo(-2.6,-58.4, -7,-54);
    c.closePath(); c.fill(); c.stroke();
    if(hair.id === 'ciufulit'){
      c.beginPath(); c.moveTo(-4,-63); c.lineTo(-7,-69); c.lineTo(0,-64); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(3,-62); c.lineTo(7,-67); c.lineTo(6,-61); c.closePath(); c.fill(); c.stroke();
    }
  }else{
    c.beginPath();
    c.moveTo(-10.5,-53);
    c.quadraticCurveTo(-11,-64, 0,-63.5);
    c.quadraticCurveTo(11,-64, 10.5,-53);
    c.quadraticCurveTo(6,-57, 1,-55);
    c.quadraticCurveTo(-5,-58, -10.5,-53);
    c.closePath(); c.fill(); c.stroke();
    if(hair.id === 'ciufulit'){
      c.beginPath(); c.moveTo(-2,-63); c.lineTo(-4,-69); c.lineTo(2,-64); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(5,-62); c.lineTo(9,-67); c.lineTo(8,-61); c.closePath(); c.fill(); c.stroke();
    }
  }

  /* --- fata: ochii si gura spun ce simte --- */
  /* din profil se vede un singur ochi, si gura e impinsa spre nasucel */
  const ochi = side ? [4.8] : [-3.6, 4.2];
  const gx   = side ? 5.6 : 0.4;
  c.fillStyle = INK; c.strokeStyle = INK;
  if(mood === 'wow'){
    /* ochi inchisi de bucurie, ca niste arcuri ^^ */
    c.lineWidth = 1.8;
    for(const ex of ochi){ c.beginPath(); c.arc(ex,-51.4,2.6,Math.PI+0.35,-0.35); c.stroke(); }
  }else if(mood === 'ouch'){
    /* ochi stransi, ca niste liniute */
    c.lineWidth = 1.9;
    for(const ex of ochi){ c.beginPath(); c.moveTo(ex-2.3,-53); c.lineTo(ex+2.3,-51); c.stroke(); }
  }else if(blink || mood === 'somn'){
    c.lineWidth = 1.8;
    for(const ex of ochi){ c.beginPath(); c.moveTo(ex-2.3,-52); c.lineTo(ex+2.3,-52); c.stroke(); }
  }else{
    for(const ex of ochi){ c.beginPath(); c.arc(ex,-52,1.7,0,7); c.fill(); }
    /* o luminita in ochi, ca sa para vie */
    c.fillStyle = '#FFF7EC';
    for(const ex of ochi){ c.beginPath(); c.arc(ex+0.6,-52.7,0.6,0,7); c.fill(); }
    c.fillStyle = INK;
  }

  c.lineWidth = 1.6; c.strokeStyle = INK;
  if(mood === 'wow'){
    /* gura deschisa de uimire */
    c.beginPath(); c.ellipse(gx,-47.6,2.9,3.4,0,0,7);
    c.fillStyle = '#C4566A'; c.fill(); c.stroke();
  }else if(mood === 'ouch'){
    c.beginPath(); c.arc(gx,-45.6,3.2,Math.PI+.25,-.25); c.stroke();
  }else{
    /* zambet — mai larg cand alearga */
    const larg = (side ? 2.6 : 3.4) + Math.min(Math.abs(o.speed || 0), 5) * 0.16;
    c.beginPath(); c.arc(gx,-48.5,larg,.2,Math.PI-.2); c.stroke();
  }
  c.lineWidth = 2.2;

  const obraji = side ? [2.4] : [-6.5, 7];
  if(mood === 'wow' && mk === 'none'){
    c.fillStyle = 'rgba(245,110,150,.42)';
    for(const ox of obraji){ c.beginPath(); c.arc(ox,-49,2.8,0,7); c.fill(); }
  }
  if(mk === 'obraji' || mk === 'sclipici'){
    c.fillStyle = 'rgba(245,110,150,.5)';
    for(const ox of obraji){ c.beginPath(); c.arc(ox,-49,2.6,0,7); c.fill(); }
  }
  if(mk === 'sclipici'){
    c.fillStyle = '#7B5CD6';
    for(const ex of ochi){ c.beginPath(); c.ellipse(ex,-55.4,3,1.4,0,0,7); c.fill(); }
    c.fillStyle = '#FFF3B0';
    [[-7,-57],[8,-58],[1,-59]].forEach(p=>{
      c.beginPath();
      c.moveTo(p[0],p[1]-2.4); c.lineTo(p[0]+1.3,p[1]); c.lineTo(p[0],p[1]+2.4); c.lineTo(p[0]-1.3,p[1]);
      c.closePath(); c.fill();
    });
  }
  c.restore();
}

/* ---------------- constructori de nivel ---------------- */
function coinRow(x,y,n,step){
  const out = []; step = step || 40;
  for(let i=0;i<n;i++) out.push({x:x+i*step, y:y, got:false});
  return out;
}
function coinArc(cx,y,n,r){
  const out = [];
  for(let i=0;i<n;i++){
    const t = (i/(n-1) - .5) * Math.PI;
    out.push({x: cx + Math.sin(t)*r, y: y - Math.cos(t)*r*0.62, got:false});
  }
  return out;
}

function buildLevel(cfg){
  const L = {
    name: cfg.name, sub: cfg.sub, theme: cfg.theme,
    len: cfg.len, groundY: 470,
    mode: cfg.mode || 'walk', after: cfg.after,
    topY: cfg.topY, startY: cfg.startY, castleY: cfg.castleY,
    platforms: [], spikes: [], monsters: [], coins: [], mushrooms: [], bits: [],
    bitKind: cfg.bitKind || 'stick', bitsNeeded: cfg.bitsNeeded || 0,
    ovenX: cfg.ovenX, baked: false, roosters: [], roostersNeeded: (cfg.roosters || []).length,
    waterTop: cfg.waterTop, collapseX: cfg.collapseX, collapsed: false,
    pits: (cfg.pits || []).map(p => ({a:p[0], b:p[1], caderi:0, pod:false})),
    goalX: cfg.goalX, goalLabel: cfg.goalLabel
  };
  cfg.platforms.forEach(p => L.platforms.push({x:p[0], y:p[1], w:p[2], h:20}));

  /* Nimic nu poate fi mai sus decat sare fetita: coboram rafturile prea inalte
     pana cand fiecare are un sprijin (solul sau un raft mai jos) la indemana. */
  const MAX_RISE = 124, MAX_GAP = 170;
  for(let pass = 0; pass < 5; pass++){
    L.platforms.forEach((a, i) => {
      let support = L.groundY;
      L.platforms.forEach((b, j) => {
        if(i === j || b.y <= a.y) return;
        const gap = b.x > a.x ? b.x - (a.x + a.w) : a.x - (b.x + b.w);
        if(gap <= MAX_GAP) support = Math.min(support, b.y);
      });
      if(support - a.y > MAX_RISE) a.y = support - MAX_RISE;
    });
  }

  cfg.spikes.forEach(s => L.spikes.push({x:s[0], n:s[1], y:L.groundY-24, w:s[1]*24, h:24}));
  cfg.monsters.forEach(m => {
    const my = (m[5] !== undefined ? m[5] : L.groundY - 32);
    L.monsters.push({
      x:m[0], y:my, y0:my, w:cfg.mw || 62, h:cfg.mh || 32, x1:m[1], x2:m[2],
      dir:1, spd:1.05 + (m[3]||0), dead:false, boo:false, t:Math.random()*6, hue:m[4]||0,
      vy:0, cool:0, pas:0, onGround:true, seek:false, blocat:false,
      kind: cfg.kind || (cfg.mode === 'fly' ? 'storm' : 'bug')
    });
  });
  (cfg.bits || []).forEach(b => L.bits.push({x:b[0], y:b[1], got:false}));
  (cfg.bitsOn || []).forEach(i => {
    const pl = L.platforms[i];
    if(pl) L.bits.push({x: pl.x + pl.w/2, y: pl.y - 30, got:false});
  });
  L.bits.forEach((b, i) => b.i = i);
  (cfg.roosters || []).forEach(r => L.roosters.push({
    x:r[0], x1:r[1], x2:r[2], y:L.groundY - 30, dir:1, t:Math.random()*6, follow:false
  }));
  (cfg.mushrooms || []).forEach(m =>
    L.mushrooms.push(Array.isArray(m) ? {x:m[0], y:m[1], got:false} : {x:m, y:L.groundY - 20, got:false}));

  /* banuti pe fiecare raft */
  L.platforms.forEach(p => {
    const n = p.w >= 170 ? 4 : 3;
    L.coins.push(...coinRow(p.x + (p.w - (n-1)*40)/2, p.y - 34, n));
  });
  /* banuti in arc peste fiecare grup de tepi */
  L.spikes.forEach(s => L.coins.push(...coinArc(s.x + s.w/2, s.y - 46, 5, 62)));
  /* un arc de banuti peste fiecare crapatura, ca sa se vada pe unde se sare */
  L.pits.forEach(pt => L.coins.push(
    ...coinArc((pt.a + pt.b)/2, L.groundY - 116, 5, (pt.b - pt.a) * 0.44)));
  if(cfg.extraCoins) L.coins.push(...cfg.extraCoins);
  return L;
}

/* Crapaturile din podeaua de bomboana: acolo nu e nimic sub ea si cade in gol.
   Ca la toboganul cu gauri, dupa a treia cadere in ACEEASI crapatura apare o
   punte — un obstacol care poate bloca definitiv e mai rau decat unul usor. */
function pitAt(L, x){
  for(const p of L.pits) if(x > p.a && x < p.b) return p;
  return null;
}
function solidGround(L, x){
  const p = pitAt(L, x);
  return !p || p.pod;
}

/* Râul: suprafata apei e o unda care se misca, deci si placa urca si coboara. */
function waveY(L, x){
  return 336 + Math.sin(x * 0.0055 + tick * 0.03) * 20 + Math.sin(x * 0.0018 + 1.1) * 12;
}
function buildSurf(cfg){
  const L = {
    name:cfg.name, sub:cfg.sub, theme:'river', mode:'surf', after:cfg.after,
    len:cfg.len, groundY:470, goalX:cfg.len - 60, goalLabel:'MALUL',
    platforms:[], spikes:[], monsters:[], coins:[], mushrooms:[], bits:[], roosters:[],
    bitKind:'stick', bitsNeeded:0, roostersNeeded:0, collapsed:false
  };
  (cfg.planks || []).forEach(p => L.platforms.push({x:p[0], y:p[1], w:p[2], h:16}));
  (cfg.crocs || []).forEach(c => L.monsters.push({
    x:c[0], y:300, y0:300, w:76, h:34, x1:c[1], x2:c[2],
    dir:-1, spd:0.5 + (c[3] || 0), dead:false, boo:false, t:Math.random()*6, hue:0, kind:'croc'
  }));
  /* banuti pe deasupra apei si peste scanduri */
  for(let x = 260; x < L.len - 200; x += 92){
    const sus = Math.sin(x * 0.0027) > 0.4;
    L.coins.push({ x:x, y: 336 - (sus ? 120 : 46), got:false });
  }
  L.platforms.forEach(p => L.coins.push(...coinRow(p.x + (p.w - 80)/2, p.y - 34, 3)));
  return L;
}

/* Toboganul gonflabil: o singura panta unduita, descrisa de o formula. */
function slideY(L, x){
  const t = clamp(x / L.len, 0, 1);
  return 165 + t*235 + Math.sin(x*0.0043)*38 + Math.sin(x*0.0017 + 1.2)*20;
}
/* Toboganul are bucati lipsa: acolo nu e nimic sub ea si cade in gol.
   Dupa a treia cadere in ACEEASI groapa apare o punte de curcubeu, ca sa nu
   ramana blocata la infinit. Fara ea, un copil care nu nimereste saltul se
   invarte in cerc pentru totdeauna — masurat: 16 caderi si zero progres. */
function gapAt(L, x){
  for(const g of L.gaps) if(x > g.a && x < g.b) return g;
  return null;
}
function onSlide(L, x){
  const g = gapAt(L, x);
  return !g || g.pod;
}
function buildSlide(cfg){
  const L = {
    name:cfg.name, sub:cfg.sub, theme:'slide', mode:'slide', after:cfg.after,
    len:cfg.len, groundY:470, goalX:cfg.len - 60, goalLabel:'GATA',
    platforms:[], spikes:[], monsters:[], coins:[], mushrooms:[], bits:[], roosters:[],
    bitKind:'stick', bitsNeeded:0, roostersNeeded:0, collapsed:false,
    gaps: (cfg.gaps || []).map(g => ({ a:g[0], b:g[1], caderi:0, pod:false }))
  };
  for(let x = 300; x < L.len - 180; x += 86){
    if(!onSlide(L, x)) continue;
    const sus = Math.sin(x*0.0031) > 0.5;
    L.coins.push({ x:x, y: slideY(L, x) - (sus ? 104 : 36), got:false });
  }
  /* un arc de banuti peste fiecare groapa, ca sa se vada pe unde se sare */
  L.gaps.forEach(g => {
    const mid = (g.a + g.b) / 2;
    L.coins.push(...coinArc(mid, slideY(L, mid) - 74, 5, (g.b - g.a) * 0.42));
  });
  return L;
}

function startY(L){
  if(L.mode === 'fly')   return L.startY;
  if(L.mode === 'swim')  return 250;
  if(L.mode === 'slide') return slideY(L, 54) - 54;
  if(L.mode === 'surf')  return waveY(L, 54) - 54;
  return L.groundY - 54;
}

function releaseAll(){ for(const k in keys) keys[k] = false; touchState.left = touchState.right = touchState.jump = touchState.fire = false; }
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if(document.hidden) releaseAll(); });

function bindPad(el, prop){
  const on  = e => { e.preventDefault(); touchState[prop] = true;  };
  const off = e => { e.preventDefault(); touchState[prop] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindPad(document.getElementById('bl'), 'left');
bindPad(document.getElementById('br'), 'right');
bindPad(document.getElementById('bj'), 'jump');
bindPad(document.getElementById('bf'), 'fire');
if(matchMedia('(pointer:coarse)').matches) document.getElementById('pad').classList.add('on');

/* ---------------- fizica ---------------- */
function hit(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* O tinem in fata unei porti pana strange ce trebuie — aceeasi regula
   pentru focul din pestera si pentru cuptorul din pizzerie. */
function gateHold(limitX, msg, msgY){
  const p = player;
  if(p.x + p.w > limitX){
    p.x = limitX - p.w;
    if(p.vx > 0) p.vx = 0;
    if(tick % 80 === 0) pops.push({x:limitX + 10, y:msgY, txt:msg, t:80, col:'#FFC93C'});
  }
}

function hurt(dir){
  const LV = LEVELS[levelIdx], md = LV.mode;
  if(player.invuln > 0) return;
  if(player.superT > 0){
    player.superT = 0; player.invuln = 80; shakeT = 10;
    player.mood = 'ouch'; player.moodT = 50;
    player.vx = (md === 'slide' || md === 'surf') ? player.vx * 0.4 : dir * 4.6;
    player.vy = md === 'fly' ? 5.5 : md === 'swim' ? 3.2 : -6.5;
    player.onGround = false;
    pops.push({x:player.x+14, y:player.y, txt:'Vai, ciuperca!', t:70, col:'#E5566A'});
    sfx.hurt();
    return;
  }
  player.hearts--; player.invuln = 96; shakeT = 14;
  player.mood = 'ouch'; player.moodT = 70;
  player.vx = (md === 'slide' || md === 'surf') ? player.vx * 0.35 : dir * 5.4;
  player.vy = md === 'fly' ? 6.5 : md === 'swim' ? 3.6 : -7.5;
  player.onGround = false;
  sfx.hurt();
  if(player.hearts <= 0){
    if(md === 'fly'){
      /* In zbor nu o trimitem tocmai jos — coboara putin si isi ia inimile inapoi. */
      player.y = Math.min(LV.startY, player.y + 420);
    }else if(md === 'swim'){
      player.y = clamp(player.y - 80, LV.waterTop, LV.groundY - player.h);
    }else if(md === 'slide' || md === 'surf'){
      player.vx = 2.6;
    }else if(LV.theme === 'cave'){
      /* Iesirea e blocata: o ducem doar cativa pasi inapoi, nu la intrare. */
      player.x = Math.max(LV.collapsed ? LV.collapseX + 40 : 60, player.x - 240);
      player.y = LV.groundY - 54;
    }else{
      player.x = 60; player.y = LV.groundY - 54;
    }
    player.vx = 0; player.vy = 0; player.falling = false;
    player.hearts = 3; player.invuln = 70;
    /* monstrii care fugeau dupa ea o pierd din ochi si se intorc acasa —
       altfel o asteapta chiar la intrare si o lovesc din prima. */
    LV.monsters.forEach(m => {
      if(!urmareste(m.kind)) return;
      m.seek = false; m.vy = 0; m.cool = 0;
      m.x = clamp(m.x, m.x1, m.x2 - m.w);
      m.y = m.y0; m.onGround = true;
    });
    pops.push({x:player.x+14, y:player.y, txt:'Hai din nou!', t:90, col:'#7B5CD6'});
  }
}

/* Cat de departe o vede si de la cat o pierde din nou. Doua praguri diferite,
   altfel se aprinde si se stinge la fiecare pas cand sta exact pe margine.
   Pe verticala e larg (260) ca sa o vada si cand s-a urcat pe un raft — altfel
   se urca acolo si ei se plimba dedesubt ca si cum n-ar fi nimeni. */
const VEDE = 330, UITA = 560, VEDE_SUS = 260;
const urmareste = k => k === 'gum' || k === 'bug';

/* Animalutele care merg pe jos: vin dupa ea, sar dupa ea pe rafturi, si nu cad
   in crapaturi — se opresc la margine. Cerut de Anabelle: "sa fie inteligenti,
   sa umble dupa noi" si "sa poata sari dupa tine". */
function moveUrmaritor(L, m, p){
  const px = m.x + m.w/2, tx = p.x + p.w/2;
  const vede = Math.abs(tx - px) < (m.seek ? UITA : VEDE) &&
               Math.abs((p.y + p.h) - (m.y + m.h)) < VEDE_SUS;
  if(vede && !m.seek){
    m.seek = true;
    pops.push({x:px, y:m.y - 14, txt:'Te-am văzut!', t:70, col:'#E5566A'});
    beep(210, .12, 'square', .03, 0);
  }
  if(!vede) m.seek = false;

  /* tinta: fetita cand o vede, altfel marginea zonei lui daca a iesit din ea */
  let tinta = null;
  if(m.seek)              tinta = tx;
  else if(px < m.x1 + 20) tinta = m.x1 + 40;
  else if(px > m.x2 - 20) tinta = m.x2 - 40;

  if(tinta !== null) m.dir = tinta > px ? 1 : -1;
  else{
    if(m.x < m.x1){ m.x = m.x1; m.dir = 1; }
    if(m.x + m.w > m.x2){ m.x = m.x2 - m.w; m.dir = -1; }
  }

  /* Marginea crapaturii il opreste si in aer, nu doar pe jos: daca l-am opri
     doar cand calca, ar putea sari peste crapatura — si atunci se pierde
     singurul loc din nivel unde fetita e in siguranta. */
  const inainte = m.dir > 0 ? m.x + m.w + 12 : m.x - 12;
  m.blocat = !solidGround(L, inainte);
  const ajuns = tinta !== null && Math.abs(tinta - px) < 10;
  /* Cat de repede vine dupa ea. Plafonul e regula, nu graba: fetita merge cu
     4.6, deci orice urmaritor trebuie sa ramana sub jumatate, ca sa poata fi
     fugarit in ORICE nivel. Fara plafon, padurea (unde animalutele erau facute
     cele mai iuti) devenea de netrecut — masurat, 13 morti si zero progres. */
  const viteza = m.seek ? Math.min(m.spd * 1.75, 2.35) : m.spd;
  if(!m.blocat && !ajuns) m.x += m.dir * viteza;
  m.x = clamp(m.x, 0, L.len - m.w);

  /* saritura: doar cand o urmareste, cand ea e mai sus si e destul de aproape */
  if(m.cool > 0) m.cool--;
  /* Sare doar dupa o fetita care STA pe ceva mai sus — nu dupa una care e in
     aer. Daca sare si dupa cea din aer, ii vine in intampinare exact cand ea
     sare peste el, si atunci nu-i mai poate sari in cap: aterizarea devine o
     lovitura. Masurat in padure: 39 de loviri si 13 morti intr-un nivel pe care
     acelasi bot il trecea fara nicio zgarietura. Inaltimea (~188) e cat sa
     ajunga pe cel mai inalt raft din joc, ca sa nu ramana niciun loc unde ea e
     in siguranta la nesfarsit — asta a cerut Anabelle. */
  if(m.onGround && m.seek && m.cool === 0 && p.onGround){
    const eaEMaiSus = (m.y + m.h) - (p.y + p.h) > 30;
    const aproape   = Math.abs(tx - px) < 170;
    if(eaEMaiSus && aproape){
      m.vy = -15.4; m.onGround = false; m.cool = 45;
      beep(330, .08, 'triangle', .025, 0);
    }
  }

  /* cade ca ea: pe podea sau pe rafturi */
  m.vy = Math.min((m.vy || 0) + 0.63, 16);
  const josInainte = m.y + m.h;
  m.y += m.vy;
  m.onGround = false;
  if(m.y + m.h > L.groundY){ m.y = L.groundY - m.h; m.vy = 0; m.onGround = true; }
  if(m.vy > 0){
    for(const pl of L.platforms){
      if(josInainte <= pl.y + 2 && m.y + m.h >= pl.y &&
         m.x + m.w > pl.x + 4 && m.x < pl.x + pl.w - 4){
        m.y = pl.y - m.h; m.vy = 0; m.onGround = true; break;
      }
    }
  }
  /* legananul din mers e doar la desen, ca sa nu se miste si locul unde poate
     fi lovit odata cu el */
  m.pas = m.onGround ? Math.abs(Math.sin(m.t * (m.seek ? 2.7 : 1.5))) * (m.seek ? 7 : 3.5) : 0;
}

function step(){
  const L = LEVELS[levelIdx], p = player;
  const left  = keys.arrowleft  || keys.a || touchState.left;
  const right = keys.arrowright || keys.d || touchState.right;
  const jump  = keys.arrowup    || keys.w || keys[' '] || touchState.jump;
  const fire  = keys.x || keys.f || touchState.fire;
  const down  = keys.arrowdown || keys.s || (L.mode === 'swim' && touchState.fire);
  const flying   = L.mode === 'fly';
  const swimming = L.mode === 'swim';
  const sliding  = L.mode === 'slide';
  const surfing  = L.mode === 'surf';

  if(sliding || surfing){
    /* Toboganul si raul o duc singure: stanga franeaza, dreapta o zoreste. */
    p.face = 1;
    p.vx += 0.4 + (right ? 0.24 : 0) - (left ? 0.55 : 0);
    p.vx = surfing ? clamp(p.vx, 2.4, p.grind ? 11 : 8.4) : clamp(p.vx, 2.1, 9.6);
  }else{
    if(left  && !right){ p.vx -= 0.85; p.face = -1; }
    if(right && !left ){ p.vx += 0.85; p.face =  1; }
    if(left === right)  p.vx *= 0.78;
    p.vx = clamp(p.vx, -4.7, 4.7);
    if(Math.abs(p.vx) < 0.05) p.vx = 0;
  }

  /* Saritura dubla: o data de pe sol, inca o data in aer ca sa ajunga mai sus. */
  if(!flying && !swimming && jump && !p.jumpLock && p.jumps > 0){
    const second = p.jumps === 1;
    p.vy = second ? -11.8 : -13.0;
    p.jumps--; p.onGround = false; p.jumpLock = true;
    second ? sfx.jump2() : sfx.jump();
    if(second){
      for(let i = 0; i < 6; i++)
        pops.push({x:p.x + 4 + i*4, y:p.y + p.h, txt:'·', t:22, col:'#BFE7DE'});
    }
  }
  if(!jump){ p.jumpLock = false; if(!swimming && p.vy < -4.2) p.vy = -4.2; }

  /* Bile de foc — doar cat timp e SUPER ANABELLE. */
  const wasOnGround = p.onGround, fellFrom = p.vy;
  if(p.cool > 0) p.cool--;
  if(fire && p.superT > 0 && p.cool === 0){
    p.cool = 15;
    balls.push({x: p.x + p.w/2 + p.face*16, y: p.y + 24, vx: p.face*8.6, vy:-1.6, t:170, sp:0});
    sfx.fire();
  }
  if(p.superT > 0) p.superT--;

  if(flying){
    /* Zâna zboară: sus ridică, jos coboară, altfel plutește lin. */
    if(jump) p.vy -= 0.74;
    if(down) p.vy += 0.62;
    if(!jump && !down) p.vy *= 0.9;
    p.vy = clamp(p.vy + 0.1, -5.8, 5.8);
    p.x = clamp(p.x + p.vx, 0, L.len - p.w);
    p.y = clamp(p.y + p.vy, L.topY, L.startY);
    if(p.y >= L.startY && p.vy > 0) p.vy = 0;
    p.onGround = false; p.jumps = 2;
  }else if(swimming){
    /* In apa: sus urca, jos coboara, si totul se misca mai lenes. */
    if(jump) p.vy -= 0.6;
    if(down) p.vy += 0.5;
    p.vy = (p.vy + 0.1) * 0.94;
    p.vy = clamp(p.vy, -4.4, 4.4);
    p.vx = clamp(p.vx * 0.93, -3.7, 3.7);
    p.x = clamp(p.x + p.vx, 0, L.len - p.w);
    p.y = clamp(p.y + p.vy, L.waterTop, L.groundY - p.h);
    if(p.y <= L.waterTop     && p.vy < 0) p.vy = 0;
    if(p.y >= L.groundY - p.h && p.vy > 0) p.vy = 0;
    p.onGround = false; p.jumps = 2;
    if(tick % 12 === 0) bubbles.push({x:p.x + 8 + Math.random()*12, y:p.y + 10, r:2 + Math.random()*3, t:90});
  }else if(sliding){
    p.vy = Math.min(p.vy + 0.62, 17);
    p.x  = clamp(p.x + p.vx, 0, L.len);
    p.y += p.vy;
    const cx = p.x + p.w/2;
    const sy = slideY(L, cx) - p.h;
    p.onGround = false;
    /* Odata intrata in groapa, e cazuta: nu se mai agata de marginea de dincolo.
       Fara asta gropile inguste nu prind pe nimeni — trece pe deasupra lor mai
       repede decat coboara si aterizeaza linistita pe partea cealalta. */
    if(!onSlide(L, cx) && p.y + p.h > slideY(L, cx) + 8) p.falling = true;
    if(!p.falling && onSlide(L, cx) && p.y >= sy){ p.y = sy; p.vy = 0; p.onGround = true; p.jumps = 1; }
    /* a cazut in gol: o inima, apoi o punem inapoi pe tobogan inainte de groapa */
    if(p.falling && p.y > H + 60){
      /* in care groapa a picat? cea mai apropiata din stanga ei */
      let vinovata = null, inapoi = 60;
      for(const g of L.gaps) if(cx > g.a && (!vinovata || g.a > vinovata.a)) vinovata = g;
      if(vinovata){
        inapoi = Math.max(60, vinovata.a - 260);
        vinovata.caderi++;
        if(vinovata.caderi >= 3 && !vinovata.pod){
          vinovata.pod = true;
          pops.push({x:(vinovata.a + vinovata.b)/2, y:slideY(L, (vinovata.a + vinovata.b)/2) - 60,
                     txt:'A apărut o punte! 🌈', t:150, col:'#8B6FD6'});
          sfx.power();
        }
      }
      hurt(0);
      p.x = inapoi; p.y = slideY(L, inapoi + p.w/2) - p.h - 30;
      p.vy = 0; p.vx = 3; p.falling = false;
      if(!vinovata || !vinovata.pod)
        pops.push({x:p.x + 14, y:p.y - 20, txt:'Hopa! Sari peste gaură', t:100, col:'#7B5CD6'});
    }
  }else if(surfing){
    /* Placa de surf urmeaza valul, iar scandurile plutesc deasupra lui. */
    p.vy = Math.min(p.vy + 0.6, 17);
    p.x  = clamp(p.x + p.vx, 0, L.len);
    const prevBottom = p.y + p.h;
    p.y += p.vy;
    p.onGround = false;
    p.grind = false;
    if(p.vy > 0){
      for(const pl of L.platforms){
        if(prevBottom <= pl.y + 2 && p.y + p.h >= pl.y && p.x + p.w > pl.x + 3 && p.x < pl.x + pl.w - 3){
          p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.grind = true; break;
        }
      }
    }
    /* Ramane lipita de bara cat timp e deasupra ei, ca pe o balustrada de skate. */
    if(!p.onGround && p.vy >= 0){
      for(const pl of L.platforms){
        const top = pl.y - p.h;
        if(p.x + p.w > pl.x + 3 && p.x < pl.x + pl.w - 3 && p.y > top - 9 && p.y < top + 16){
          p.y = top; p.vy = 0; p.onGround = true; p.grind = true; break;
        }
      }
    }
    if(!p.onGround){
      const wy = waveY(L, p.x + p.w/2) - p.h;
      if(p.y >= wy){ p.y = wy; p.vy = 0; p.onGround = true; }
    }
    /* pe bara aluneca mai repede si scapara, ca pe o teava de skate */
    if(p.grind){
      p.vx = Math.min(p.vx + 0.22, 10.5);
      if(!p.grindT) sfx.jump2();
      p.grindT++;
      if(p.grindT % 3 === 0)
        pops.push({x:p.x + 2 + Math.random()*24, y:p.y + p.h + 4, txt:'✦',
                   t:16, col:'#FFD447'});
    }else p.grindT = 0;
    if(p.onGround) p.jumps = 2;
  }else{
    p.vy = Math.min(p.vy + 0.63, 16);
    p.x = clamp(p.x + p.vx, 0, L.len - p.w);

    const prevBottom = p.y + p.h;
    p.y += p.vy;
    p.onGround = false;
    /* Odata intrata in crapatura, e cazuta: nu se mai prinde de marginea de
       dincolo. Fara asta o crapatura ingusta nu prinde pe nimeni — masurat:
       la 130 de pasi latime ii trebuie 28 de cadre ca sa o traverseze si doar
       24 ca sa cada sub ecran, deci la viteza maxima trecea pe deasupra ei si
       ateriza linistita dincolo. Aceeasi capcana ca la gaurile din tobogan. */
    if(!solidGround(L, p.x + p.w/2) && p.y + p.h > L.groundY + 6) p.falling = true;
    if(!p.falling){
      if(p.y + p.h > L.groundY && solidGround(L, p.x + p.w/2)){
        p.y = L.groundY - p.h; p.vy = 0; p.onGround = true;
      }
      if(p.vy > 0){
        for(const pl of L.platforms){
          if(prevBottom <= pl.y + 2 && p.y + p.h >= pl.y && p.x + p.w > pl.x + 3 && p.x < pl.x + pl.w - 3){
            p.y = pl.y - p.h; p.vy = 0; p.onGround = true; break;
          }
        }
      }
    }
    if(p.onGround) p.jumps = 2;

    /* a cazut intr-o crapatura: o inima, apoi inapoi pe marginea dinainte */
    if(L.pits.length && p.y > H + 60){
      let vinovata = null;
      for(const pt of L.pits)
        if(p.x + p.w/2 > pt.a && (!vinovata || pt.a > vinovata.a)) vinovata = pt;
      if(vinovata){
        vinovata.caderi++;
        if(vinovata.caderi >= 3 && !vinovata.pod){
          vinovata.pod = true;
          pops.push({x:(vinovata.a + vinovata.b)/2, y:L.groundY - 96,
                     txt:'A apărut o punte! 🌈', t:150, col:'#8B6FD6'});
          sfx.power();
        }
      }
      /* O punem inapoi NOI, mereu. Nu ne bazam pe hurt() sa o mute: cat timp
         e inca invulnerabila de la lovitura dinainte, hurt() iese din prima
         linie si nu face nimic — si atunci ramanea in cadere libera, numarand
         cate o cadere pe cadru pana trecea de crapatura si ateriza dincolo. */
      const inimiInainte = p.hearts;
      hurt(0);
      const arepornit = p.hearts > inimiInainte;   /* a ramas fara inimi */
      p.falling = false; p.vx = 0; p.vy = 0;
      p.x = (arepornit || !vinovata) ? 60 : Math.max(40, vinovata.a - 96);
      p.y = L.groundY - p.h; p.onGround = true;
      if(!arepornit && (!vinovata || !vinovata.pod))
        pops.push({x:p.x + 14, y:p.y - 24, txt:'Hopa! Sari peste crăpătură', t:100, col:'#7B5CD6'});
    }
  }
  p.walk += p.onGround ? Math.abs(p.vx) * 0.19 : 0.06;
  if(p.invuln > 0) p.invuln--;

  /* --- mimica: turtire la aterizare, clipit, plictiseala --- */
  if(p.onGround && !wasOnGround && fellFrom > 3.4) p.squashT = 11;
  if(p.squashT > 0) p.squashT--;
  if(p.moodT > 0){ p.moodT--; if(p.moodT === 0) p.mood = 'ok'; }
  if(Math.abs(p.vx) < 0.2 && p.onGround) p.idleT++; else p.idleT = 0;
  if(tick > p.blinkAt){ p.blinkAt = tick + 70 + Math.floor(Math.abs(Math.sin(tick)) * 130); }

  /* --- banuti --- */
  for(const c of L.coins){
    if(c.got) continue;
    if(Math.abs((p.x+p.w/2) - c.x) < 22 && Math.abs((p.y+p.h/2) - c.y) < 26){
      c.got = true; purse++; sfx.coin();
      p.mood = 'wow'; p.moodT = 26;
      pops.push({x:c.x, y:c.y, txt:'+1', t:44, col:COIND});
    }
  }

  /* --- ciuperci magice --- */
  for(const mu of L.mushrooms){
    if(mu.got) continue;
    if(Math.abs((p.x+p.w/2) - mu.x) < 26 && Math.abs((p.y+p.h/2) - mu.y) < 34){
      mu.got = true; p.superT = 60*22; sfx.power();
      p.mood = 'wow'; p.moodT = 70;
      pops.push({x:mu.x, y:mu.y - 20, txt:'SUPER ANABELLE!', t:110, col:'#E5566A'});
    }
  }

  /* --- lucrurile de strans: vreascuri in pestera, ingrediente in pizzerie --- */
  for(const b of L.bits){
    if(b.got) continue;
    if(Math.abs((p.x+p.w/2) - b.x) < 40){
      b.got = true; bitsGot++; sfx.coin();
      p.mood = 'wow'; p.moodT = 60;
      pops.push({x:b.x, y:b.y - 18,
                 txt:(L.bitKind === 'stick' ? 'Vreasc ' : 'Ingredient ') + bitsGot + ' din ' + L.bitsNeeded,
                 t:80, col:'#D79A5B'});
    }
  }

  /* --- bile de foc --- */
  for(let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    b.sp += 0.3;
    b.vy = Math.min(b.vy + 0.32, 9);
    b.x += b.vx; b.y += b.vy; b.t--;
    if(L.mode !== 'fly' && b.y > L.groundY - 8){ b.y = L.groundY - 8; b.vy = -5.4; }
    for(const pl of L.platforms){
      if(b.x > pl.x && b.x < pl.x + pl.w && b.y > pl.y - 8 && b.y < pl.y + 10 && b.vy > 0){
        b.y = pl.y - 8; b.vy = -5.0;
      }
    }
    let spent = false;
    for(const m of L.monsters){
      if(m.dead) continue;
      if(b.x > m.x - 6 && b.x < m.x + m.w + 6 && b.y > m.y - 6 && b.y < m.y + m.h + 6){
        m.dead = true; purse += 2; spent = true; sfx.stomp();
        pops.push({x:m.x + m.w/2, y:m.y - 6, txt:'+2', t:52, col:'#E5566A'});
        break;
      }
    }
    if(spent || b.t <= 0 || b.x < cam - 120 || b.x > cam + W + 120 ||
       b.y < camY - 150 || b.y > camY + H + 150) balls.splice(i, 1);
  }

  /* --- monstruleti --- */
  /* Animalutele NU se plimba prosteste: cat timp o vad, vin dupa ea si sar dupa
     ea pe rafturi. Sunt insa mai lente decat ea (cel mult 2.6 fata de 4.6), ca
     sa poata fi fugarite, si nu cad in crapaturi — se opresc la margine. */
  for(const m of L.monsters){
    if(m.dead) continue;
    /* crocodilul scufundat coboara si iese din joc — nu mai musca pe drum */
    if(m.sunk){
      m.sinkT++;
      m.y += 2.4;
      if(m.sinkT % 7 === 0)
        bubbles.push({x:m.x + m.w/2 + (Math.random()-.5)*40, y:m.y, r:3 + Math.random()*3, t:70});
      if(m.sinkT > 70) m.dead = true;
      continue;
    }
    m.t += 0.09;
    if(urmareste(m.kind)) moveUrmaritor(L, m, p);
    else m.x += m.dir * m.spd;
    if(m.kind === 'bat'){
      m.y = m.y0 + Math.sin(m.t * 1.35) * 26;
      if(!m.boo && Math.abs((p.x + p.w/2) - (m.x + m.w/2)) < 240){
        m.boo = true; boos++;
        pops.push({x:m.x + m.w/2, y:m.y - 12, txt:'Buu!', t:80, col:'#CBB6F2'});
        beep(160, .2, 'sawtooth', .035, 0);
        if(boos === 3)
          pops.push({x:p.x + 14, y:p.y - 12, txt:'Nu mi-e frică!', t:110, col:'#BFE7DE'});
      }
    }
    if(m.kind === 'jelly') m.y = m.y0 + Math.sin(m.t * 0.9) * 34;
    if(m.kind === 'croc')  m.y = waveY(L, m.x + m.w/2) - 22;
    if(!urmareste(m.kind)){
      if(m.x < m.x1){ m.x = m.x1; m.dir = 1; }
      if(m.x + m.w > m.x2){ m.x = m.x2 - m.w; m.dir = -1; }
    }
    if(hit(p, m)){
      if(m.kind === 'croc' && p.vy > 1.2 && (p.y + p.h) - m.y < 44){
        /* aterizeaza pe el cu placa si il baga la fund */
        m.sunk = true; m.sinkT = 0; p.vy = -9.4; purse += 2; shakeT = 8;
        p.mood = 'wow'; p.moodT = 40;
        sfx.stomp();
        pops.push({x:m.x + m.w/2, y:m.y - 10, txt:'Pleosc!', t:60, col:'#4FB3D9'});
      }else if(m.kind !== 'storm' && m.kind !== 'croc' && p.vy > 1.2 && (p.y + p.h) - m.y < 26){
        m.dead = true; p.vy = -10.2; purse += 2; sfx.stomp();
        pops.push({x:m.x + m.w/2, y:m.y - 6, txt:'+2', t:52, col:'#7B5CD6'});
      }else{
        hurt(p.x + p.w/2 < m.x + m.w/2 ? -1 : 1);
      }
    }
  }

  /* --- tepi --- */
  for(const s of L.spikes){
    if(hit(p, {x:s.x+3, y:s.y+8, w:s.w-6, h:s.h-8})) hurt(p.x + p.w/2 < s.x + s.w/2 ? -1 : 1);
  }

  /* --- cuptorul: fara ingrediente nu se coace nimic --- */
  const bitsReady = !L.bitsNeeded || bitsGot >= L.bitsNeeded;
  const bitMsg = (L.bitKind === 'ingredient' ? 'Mai caută ingrediente (' : 'Mai caută vreascuri (')
                 + bitsGot + ' din ' + L.bitsNeeded + ')';
  if(L.ovenX && !L.baked){
    if(!bitsReady){
      gateHold(L.ovenX, bitMsg, L.groundY - 150);
    }else if(p.x + p.w > L.ovenX){
      L.baked = true; look.pizza = true; shakeT = 8;
      showOven();
      return;
    }
  }

  /* --- cocosii vin dupa mirosul de pizza --- */
  for(let i = 0; i < L.roosters.length; i++){
    const r = L.roosters[i];
    r.t += 0.1;
    if(r.follow){
      /* merg in sir in spatele ei, fiecare cu o intarziere */
      const behind = p.x - (i + 1) * 44 * (p.face >= 0 ? 1 : -1);
      r.x += (behind - r.x) * 0.07;
      r.dir = behind > r.x ? 1 : -1;
      r.y = L.groundY - 30 - Math.abs(Math.sin(r.t * 3)) * 9;
    }else{
      r.x += r.dir * 0.7;
      if(r.x < r.x1){ r.x = r.x1; r.dir = 1; }
      if(r.x > r.x2){ r.x = r.x2; r.dir = -1; }
      r.y = L.groundY - 30;
      /* mirosul de pizza bate departe, ca sa nu fie nevoie de o atingere exacta */
      if(Math.abs((p.x + p.w/2) - r.x) < 84){
        if(L.baked){
          r.follow = true; roostersGot++; sfx.coin();
          p.mood = 'wow'; p.moodT = 60;
          pops.push({x:r.x, y:r.y - 34, txt:'Cotcodac! ' + roostersGot + ' din ' + L.roostersNeeded,
                     t:80, col:'#E5566A'});
        }else if(tick % 60 === 0){
          pops.push({x:r.x, y:r.y - 34, txt:'Îi trebuie pizza…', t:60, col:'#7B5CD6'});
        }
      }
    }
  }

  /* --- peretele se prabuseste in spatele ei --- */
  if(L.collapseX && !L.collapsed && p.x > L.collapseX){
    L.collapsed = true; shakeT = 46;
    beep(90, .5, 'sawtooth', .06, 0); beep(60, .7, 'sawtooth', .05, .12);
    showCollapse();
    return;
  }
  if(L.collapsed && p.x < L.collapseX - 120){ p.x = L.collapseX - 120; p.vx = 0; }

  /* --- ușa / castelul / focul / țestoasa --- */
  let arrived;
  if(flying)       arrived = p.y < L.castleY;
  else if(sliding || surfing) arrived = p.x > L.len - 90;
  else             arrived = p.x + p.w > L.goalX + 20;

  /* Focul nu se aprinde fara toate vreascurile. */
  if(arrived && !L.ovenX && !bitsReady){
    arrived = false;
    gateHold(L.goalX + 20, bitMsg, L.groundY - 110);
  }
  /* Porcul nu vine pana nu are tot alaiul de cocosi. */
  if(arrived && L.roostersNeeded && roostersGot < L.roostersNeeded){
    arrived = false;
    gateHold(L.goalX + 20,
             'Mai momește cocoși (' + roostersGot + ' din ' + L.roostersNeeded + ')',
             L.groundY - 150);
  }

  if(arrived){
    sfx.win();
    if(L.after === 'shop')        showShop();
    else if(L.after === 'pizzeria') showPizzeria();
    else if(L.after === 'pig')      showPig();
    else if(L.after === 'candy')    showCandy();
    else if(L.after === 'arma')     showArma();
    else if(L.after === 'salon')  showSalon();
    else if(L.after === 'fairy')  showFairy();
    else if(L.after === 'castle') showCastle();
    else if(L.after === 'fire')   showFire();
    else if(L.after === 'turtle') showTurtle();
    else                          showEnd();
    return;
  }

  cam  = clamp(p.x - W*0.38, 0, Math.max(0, L.len - W));
  camY = flying ? clamp(p.y - H*0.5, L.topY - 60, L.startY + 86 - H) : 0;
  for(let i = bubbles.length - 1; i >= 0; i--){
    const b = bubbles[i]; b.y -= 0.9; b.x += Math.sin(b.t * 0.14) * 0.4; b.t--;
    if(b.t <= 0 || b.y < (L.waterTop || 0)) bubbles.splice(i, 1);
  }
  if(L.theme === 'river') void 0;
  for(let i = pops.length-1; i >= 0; i--){ pops[i].t--; pops[i].y -= 0.7; if(pops[i].t <= 0) pops.splice(i,1); }
  if(shakeT > 0) shakeT--;
}

/* ---------------- randare ---------------- */
function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round((pa>>16) + ((pb>>16) - (pa>>16))*t);
  const gg= Math.round(((pa>>8)&255) + (((pb>>8)&255) - ((pa>>8)&255))*t);
  const bl= Math.round((pa&255) + ((pb&255) - (pa&255))*t);
  return 'rgb(' + r + ',' + gg + ',' + bl + ')';
}

function puff(c, x, y, r){
  c.beginPath();
  c.arc(x - r*0.7, y + r*0.16, r*0.62, 0, 7);
  c.arc(x,         y - r*0.22, r*0.86, 0, 7);
  c.arc(x + r*0.75,y + r*0.14, r*0.66, 0, 7);
  c.arc(x + r*0.1, y + r*0.34, r*0.72, 0, 7);
  c.fill();
}

const SKY_PUFFS = [];
for(let i = 0; i < 46; i++)
  SKY_PUFFS.push({ x:(i*211) % 1020 - 30, y:(i*163) % 1500, r:26 + (i*37) % 40, d:0.3 + (i % 3)*0.26 });

function drawSky(L){
  const t = clamp((camY - L.topY) / (L.startY - L.topY), 0, 1);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, lerpHex('#B78FE2', '#8FCBEC', t));
  sky.addColorStop(1, lerpHex('#F7CFE4', '#DCF1FB', t));
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  /* soare palid sus de tot */
  g.globalAlpha = (1 - t) * 0.5;
  g.fillStyle = '#FFF3B0';
  g.beginPath(); g.arc(W - 140, 100, 62, 0, 7); g.fill();
  g.globalAlpha = 1;

  for(const q of SKY_PUFFS){
    const sy = (((q.y - camY * q.d) % 1500) + 1500) % 1500 - 260;
    if(sy < -140 || sy > H + 140) continue;
    g.fillStyle = 'rgba(255,255,255,' + (0.32 + q.d * 0.35).toFixed(2) + ')';
    puff(g, q.x, sy, q.r);
  }
}

function drawForest(L){
  const sky = g.createLinearGradient(0, 0, 0, L.groundY);
  sky.addColorStop(0, '#CDE3D0'); sky.addColorStop(1, '#9CC5A8');
  g.fillStyle = sky; g.fillRect(0, 0, W, L.groundY);

  /* raze printre coroane */
  g.fillStyle = 'rgba(255,247,236,.22)';
  for(let x = -((cam*0.25) % 300); x < W + 300; x += 300){
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 70, 0); g.lineTo(x + 170, L.groundY); g.lineTo(x + 40, L.groundY);
    g.closePath(); g.fill();
  }
  /* trunchiuri departate */
  const far = cam * 0.34;
  for(let i = -1; i < 16; i++){
    const x = i*250 - (far % 250);
    g.fillStyle = 'rgba(70,52,40,.2)';
    rr(g, x, 120, 46, 350, 10); g.fill();
    g.fillStyle = 'rgba(60,120,84,.28)';
    g.beginPath(); g.ellipse(x + 23, 118, 96, 62, 0, 0, 7); g.fill();
  }
  /* tufe apropiate */
  const near = cam * 0.72;
  for(let i = -1; i < 20; i++){
    const x = i*195 - (near % 195);
    g.fillStyle = 'rgba(46,80,58,.3)';
    g.beginPath(); g.ellipse(x + 32, 424, 46, 38, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,201,60,.35)';
    g.beginPath(); g.arc(x + 20, 410, 5, 0, 7); g.fill();
    g.beginPath(); g.arc(x + 46, 424, 4, 0, 7); g.fill();
  }
  /* covor de frunze */
  g.fillStyle = '#6E9A6E'; g.fillRect(0, L.groundY, W, H - L.groundY);
  g.fillStyle = '#5C8760';
  const tile = 64, off = cam % tile;
  for(let x = -off; x < W; x += tile) g.fillRect(x, L.groundY, tile/2, H - L.groundY);
  g.fillStyle = INK; g.fillRect(0, L.groundY - 4, W, 4);
}



/* ---------------- pizzeria, porcul, raul ---------------- */
function drawPizzaRoom(L){
  /* dincolo de cuptor incepe curtea, deci peretele se face cer */
  const yard = clamp((cam + W*0.45 - L.ovenX) / 700, 0, 1);
  const sky = g.createLinearGradient(0, 0, 0, L.groundY);
  sky.addColorStop(0, lerpHex('#F6D9B0', '#BFE3F7', yard));
  sky.addColorStop(1, lerpHex('#E9BE8E', '#DFF1D6', yard));
  g.fillStyle = sky; g.fillRect(0, 0, W, L.groundY);

  if(yard < 0.85){
    /* caramizile bucatariei */
    g.globalAlpha = 1 - yard;
    g.fillStyle = 'rgba(190,120,80,.28)';
    const bw = 96, bh = 34;
    for(let ry = 60; ry < L.groundY; ry += bh){
      const off = ((ry / bh) % 2) * (bw/2) - (cam * 0.35) % bw;
      for(let x = -bw + off; x < W + bw; x += bw) g.fillRect(x, ry, bw - 6, bh - 6);
    }
    /* tigai atarnate */
    const far = cam * 0.5;
    for(let i = -1; i < 14; i++){
      const x = i*260 - (far % 260);
      g.fillStyle = 'rgba(46,36,56,.22)';
      g.beginPath(); g.arc(x, 96, 26, 0, 7); g.fill();
      g.fillRect(x + 24, 90, 40, 9);
    }
    g.globalAlpha = 1;
  }
  if(yard > 0.15){
    /* gardul curtii */
    g.globalAlpha = yard;
    const near = cam * 0.6;
    for(let i = -1; i < 18; i++){
      const x = i*54 - (near % 54);
      g.fillStyle = '#C79A63';
      rr(g, x, 300, 26, 150, 5); g.fill();
      g.strokeStyle = 'rgba(46,36,56,.35)'; g.lineWidth = 2; g.stroke();
    }
    g.fillStyle = '#A8804F'; g.fillRect(0, 330, W, 12); g.fillRect(0, 392, W, 12);
    g.globalAlpha = 1;
  }

  /* podeaua: gresie in careuri */
  g.fillStyle = lerpHex('#F0DCC2', '#8FC48F', yard); g.fillRect(0, L.groundY, W, H - L.groundY);
  g.fillStyle = lerpHex('#DCC3A2', '#7CB07C', yard);
  const tile = 64, off = cam % tile;
  for(let x = -off; x < W; x += tile) g.fillRect(x, L.groundY, tile/2, H - L.groundY);
  g.fillStyle = INK; g.fillRect(0, L.groundY - 4, W, 4);
}

function drawOven(L, baked){
  const x = L.ovenX, y = L.groundY;
  g.save();
  g.lineWidth = 2.8; g.strokeStyle = INK; g.lineJoin = 'round';
  /* vatra */
  rr(g, x - 96, y - 176, 192, 176, 14); g.fillStyle = '#C0705A'; g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.18)';
  for(let ry = 0; ry < 5; ry++) g.fillRect(x - 90, y - 168 + ry*34, 180, 5);
  /* gura cuptorului */
  g.beginPath(); g.arc(x, y - 62, 48, Math.PI, 0); g.lineTo(x + 48, y - 6);
  g.lineTo(x - 48, y - 6); g.closePath();
  g.fillStyle = '#2E2438'; g.fill(); g.stroke();
  const f = 1 + Math.sin(tick * 0.22) * 0.1;
  g.save(); g.translate(x, y - 14); g.scale(f, f);
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(26, -18, 0, -54); g.quadraticCurveTo(-26, -18, 0, 0);
  g.closePath(); g.fillStyle = '#F2884B'; g.fill();
  g.beginPath(); g.moveTo(0, -4); g.quadraticCurveTo(12, -16, 0, -38); g.quadraticCurveTo(-12, -16, 0, -4);
  g.closePath(); g.fillStyle = '#FFD447'; g.fill();
  g.restore();
  /* cosul si fumul */
  rr(g, x + 40, y - 220, 34, 50, 6); g.fillStyle = '#A85C48'; g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.55)';
  for(let i = 0; i < 3; i++){
    const t = (tick * 0.6 + i * 40) % 120;
    g.globalAlpha = 0.5 * (1 - t/120);
    g.beginPath(); g.arc(x + 57 + Math.sin(t*0.05)*10, y - 226 - t, 10 + t*0.09, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = INK; g.font = '700 19px Fredoka, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(baked ? 'PIZZA E GATA' : 'CUPTORUL', x, y - 248);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.restore();
}

function drawRooster(r){
  g.save(); g.translate(r.x, r.y);
  g.scale(r.dir >= 0 ? 1 : -1, 1);
  g.lineWidth = 2.3; g.strokeStyle = INK; g.lineJoin = 'round';
  /* coada */
  g.beginPath(); g.moveTo(-10, -6);
  g.quadraticCurveTo(-30, -14, -26, -34);
  g.quadraticCurveTo(-16, -22, -6, -18); g.closePath();
  g.fillStyle = '#4E4270'; g.fill(); g.stroke();
  /* picioare */
  g.strokeStyle = '#E39B12'; g.lineWidth = 3;
  for(const lx of [-3, 5]){
    g.beginPath(); g.moveTo(lx, 12); g.lineTo(lx + Math.sin(r.t*3)*2, 24); g.stroke();
  }
  g.lineWidth = 2.3; g.strokeStyle = INK;
  /* corp */
  g.beginPath(); g.ellipse(0, 0, 17, 15, 0, 0, 7);
  g.fillStyle = '#FFF7EC'; g.fill(); g.stroke();
  /* cap */
  g.beginPath(); g.arc(11, -17, 10, 0, 7); g.fill(); g.stroke();
  /* creasta */
  g.fillStyle = '#E5566A';
  g.beginPath(); g.moveTo(4, -25);
  g.quadraticCurveTo(7, -34, 11, -26);
  g.quadraticCurveTo(15, -34, 18, -25); g.closePath(); g.fill(); g.stroke();
  /* barbita */
  g.beginPath(); g.ellipse(12, -8, 4, 5, 0, 0, 7); g.fill(); g.stroke();
  /* cioc */
  g.fillStyle = '#FFC93C';
  g.beginPath(); g.moveTo(19, -18); g.lineTo(29, -15); g.lineTo(19, -13); g.closePath();
  g.fill(); g.stroke();
  /* ochi */
  g.fillStyle = INK;
  g.beginPath(); g.arc(14, -20, 1.9, 0, 7); g.fill();
  g.restore();
}

/* Porcul — desenat si in joc, si in panoul unde il coloreaza. */
function drawPig(c, pigId, o){
  const pig = byId(PIGS, pigId);
  const sc = o.scale || 1;
  c.save(); c.translate(o.x, o.y); c.scale((o.face || 1) * sc, sc);
  c.lineWidth = 2.6 / sc; c.lineJoin = 'round'; c.strokeStyle = INK;

  const body = () => {
    if(pig.rainbow){
      const gr = c.createLinearGradient(-46, 0, 46, 0);
      ['#F2545B','#F9A03F','#FFD447','#5FC98B','#4FB3D9','#8B6FD6']
        .forEach((col, i) => gr.addColorStop(i/5, col));
      return gr;
    }
    return pig.a;
  };
  /* picioare */
  for(const lx of [-26, -8, 12, 30]){
    rr(c, lx, 12, 12, 22, 5); c.fillStyle = pig.b; c.fill(); c.stroke();
  }
  /* trup */
  c.beginPath(); c.ellipse(0, -6, 46, 30, 0, 0, 7);
  c.fillStyle = body(); c.fill(); c.stroke();
  if(pig.spots){
    c.fillStyle = pig.b;
    for(const sp of [[-22,-14,8],[6,-20,6],[18,-2,9],[-8,2,5]]){
      c.beginPath(); c.arc(sp[0], sp[1], sp[2], 0, 7); c.fill();
    }
  }
  /* codita */
  c.beginPath(); c.moveTo(-44, -14);
  c.bezierCurveTo(-58, -18, -54, -30, -46, -28);
  c.lineWidth = 3.4 / sc; c.strokeStyle = pig.b; c.stroke();
  c.lineWidth = 2.6 / sc; c.strokeStyle = INK;
  /* cap */
  c.beginPath(); c.ellipse(42, -12, 24, 22, 0, 0, 7);
  c.fillStyle = body(); c.fill(); c.stroke();
  /* urechi — una in fata, una in spate, ca sa nu se calce una pe alta */
  c.beginPath(); c.moveTo(28, -24); c.lineTo(33, -44); c.lineTo(45, -28); c.closePath();
  c.fillStyle = pig.b; c.fill(); c.stroke();
  c.beginPath(); c.moveTo(46, -26); c.lineTo(54, -42); c.lineTo(60, -22); c.closePath();
  c.fill(); c.stroke();
  /* rat */
  c.beginPath(); c.ellipse(62, -8, 12, 10, 0, 0, 7);
  c.fillStyle = pig.b; c.fill(); c.stroke();
  c.fillStyle = INK;
  c.beginPath(); c.ellipse(59, -8, 2.2, 3.4, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(66, -8, 2.2, 3.4, 0, 0, 7); c.fill();
  /* ochi */
  c.beginPath(); c.arc(46, -20, 2.6, 0, 7); c.fill();
  c.restore();
}

function drawRiver(L){
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#8FD0F0'); sky.addColorStop(1, '#DFF1D6');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = '#FFF3B0';
  g.beginPath(); g.arc(W - 130, 84, 46, 0, 7); g.fill();

  /* malul departat, cu palmieri */
  const far = cam * 0.3;
  g.fillStyle = 'rgba(110,170,120,.55)';

function drawSlide(L){
  const x0 = Math.max(0, cam - 80), x1 = Math.min(L.len, cam + W + 80);
  /* desenam pe bucati, sarind gropile */
  const band = (off, col, wid) => {
    g.lineWidth = wid; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
    let pornit = false;
    g.beginPath();
    for(let x = x0; x <= x1; x += 10){
      if(onSlide(L, x)){
        if(pornit) g.lineTo(x, slideY(L, x) + off);
        else { g.moveTo(x, slideY(L, x) + off); pornit = true; }
      }else pornit = false;
    }
    g.stroke();
  };
  band(9, INK, 34);                              /* conturul */
  /* dungi de curcubeu, fiecare bucata cu culoarea ei */
  const cols = ['#F2545B','#FFB020','#FFD447','#5FC98B','#4FB3D9','#8B6FD6'];
  const seg = 150, from = Math.floor(x0/seg)*seg;
  for(let sx = from; sx < x1; sx += seg){
    g.beginPath();
    for(let x = sx - 6; x <= sx + seg + 6; x += 8) g.lineTo(x, slideY(L, x) + 9);
    g.lineWidth = 27; g.lineCap = 'butt'; g.lineJoin = 'round';
    g.strokeStyle = cols[((sx/seg) % 6 + 6) % 6];
    g.stroke();
  }
  band(2, 'rgba(255,255,255,.6)', 5);            /* luciul de plastic */

  /* umflaturile de tobogan gonflabil */
  for(let x = Math.floor(x0/70)*70; x <= x1; x += 70){
    if(!onSlide(L, x)) continue;
    g.beginPath(); g.arc(x, slideY(L, x) + 9, 12, 0, 7);
    g.fillStyle = 'rgba(255,255,255,.22)'; g.fill();
  }
  /* capetele rupte de la fiecare groapa, ca sa se vada de departe */
  for(const gp of L.gaps){
    if(gp.b < x0 - 60 || gp.a > x1 + 60) continue;
    if(gp.pod){
      /* puntea de curcubeu care apare dupa a treia cadere */
      g.lineWidth = 9; g.lineCap = 'round';
      const cols = ['#F2545B','#FFB020','#FFD447','#5FC98B','#4FB3D9','#8B6FD6'];
      for(let k = 0; k < 6; k++){
        g.strokeStyle = cols[k];
        g.beginPath();
        for(let x = gp.a - 6; x <= gp.b + 6; x += 8) g.lineTo(x, slideY(L, x) + 4 + k*6);
        g.stroke();
      }
      g.lineWidth = 2.6; g.strokeStyle = INK;
      g.beginPath();
      for(let x = gp.a - 6; x <= gp.b + 6; x += 8) g.lineTo(x, slideY(L, x) - 1);
      g.stroke();
      continue;
    }
    for(const [ex, dir] of [[gp.a, -1], [gp.b, 1]]){
      const ey = slideY(L, ex) + 9;
      g.save(); g.translate(ex, ey);
      g.beginPath();
      g.moveTo(0, -17); g.lineTo(dir*9, -9); g.lineTo(0, -2);
      g.lineTo(dir*8, 5); g.lineTo(0, 12); g.lineTo(-dir*4, 0);
      g.closePath();
      g.fillStyle = '#FFF7EC'; g.fill();
      g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
      g.restore();
    }
    /* semn de atentie deasupra gropii */
    const mx = (gp.a + gp.b) / 2, my = slideY(L, mx) - 118;
    g.save(); g.translate(mx, my + Math.sin(tick*0.07)*4);
    g.beginPath(); g.moveTo(0,-13); g.lineTo(13,10); g.lineTo(-13,10); g.closePath();
    g.fillStyle = '#FFC93C'; g.fill();
    g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
    g.fillStyle = INK; g.font = '700 13px Fredoka, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('!', 0, 3);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.restore();
  }
  g.lineCap = 'butt';
}
