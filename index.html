function drawBit(b, ph, kind){
  if(b.got) return;
  g.save(); g.translate(b.x, b.y + Math.sin(ph) * 3);
  g.lineWidth = 2.2; g.strokeStyle = INK; g.lineJoin = 'round';
  if(kind === 'ingredient'){
    const which = (b.i || 0) % 3;
    if(which === 0){                       /* rosie */
      g.beginPath(); g.arc(0, 0, 13, 0, 7); g.fillStyle = '#E5566A'; g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-7, -11); g.lineTo(0, -18); g.lineTo(7, -11); g.closePath();
      g.fillStyle = '#5FC98B'; g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.beginPath(); g.arc(-4.6, -4, 3.2, 0, 7); g.fill();
    }else if(which === 1){                 /* felie de cascaval */
      g.beginPath(); g.moveTo(-14, 9); g.lineTo(14, 9); g.lineTo(0, -12); g.closePath();
      g.fillStyle = '#FFD447'; g.fill(); g.stroke();
      g.fillStyle = '#E39B12';
      for(const hl of [[-5,4],[5,3],[0,-3]]){
        g.beginPath(); g.arc(hl[0], hl[1], 2.4, 0, 7); g.fill();
      }
    }else{                                 /* cocoloș de aluat */
      g.beginPath(); g.ellipse(0, 2, 15, 11, 0, 0, 7);
      g.fillStyle = '#F3E0C0'; g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.6)';
      g.beginPath(); g.ellipse(-4, -2, 5, 3, -0.3, 0, 7); g.fill();
    }
  }else{                                   /* vreasc */
    g.rotate(-0.25); rr(g, -18, -3, 36, 7, 3.5); g.fillStyle = '#A9713F'; g.fill(); g.stroke();
    g.rotate(0.55);  rr(g, -16, -3, 32, 6, 3);   g.fillStyle = '#C68B52'; g.fill(); g.stroke();
  }
  g.restore();
  g.save(); g.globalAlpha = .5; g.fillStyle = '#FFD447';
  sparkle(g, b.x + 16, b.y - 20 + Math.sin(ph*1.4)*3, 5);
  g.restore();
}

  /* bula de vorbire */
  g.save();
  g.translate(x - 40, y - 118 + Math.sin(tick*0.03)*7);
  rr(g, -96, -34, 192, 52, 16); g.fillStyle = '#FFF7EC'; g.fill();
  g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
  g.beginPath(); g.moveTo(-36, 16); g.lineTo(-52, 36); g.lineTo(-18, 17); g.closePath();
  g.fillStyle = '#FFF7EC'; g.fill(); g.stroke();
  g.fillStyle = INK; g.font = '600 19px Fredoka, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Bună, Anabelle!', 0, -9);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

}

function drawBubbles(){

    g.fillStyle = 'rgba(255,255,255,.3)'; g.fill();

/* Intunericul din pestera: vede doar cat lumineaza torța. */
function drawDark(L){
  const p = player;
  const px = p.x + p.w/2 - cam, py = p.y + p.h/2 - camY;
  const r  = (look.torch ? 330 : 198) + Math.sin(tick * 0.13) * 9;
  const gr = g.createRadialGradient(px, py, r * 0.3, px, py, r);
  gr.addColorStop(0, 'rgba(12,8,22,0)');
  gr.addColorStop(0.62, 'rgba(12,8,22,.55)');
  gr.addColorStop(1, 'rgba(12,8,22,.94)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  /* focul lumineaza si el, chiar daca fetita e mai departe */
  if(bitsGot >= L.bitsNeeded){
    const fx = L.goalX + 60 - cam, fy = L.groundY - 50;
    const fg = g.createRadialGradient(fx, fy, 10, fx, fy, 200);
    fg.addColorStop(0, 'rgba(255,196,90,.5)'); fg.addColorStop(1, 'rgba(255,196,90,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, 200, 0, 7); g.fill();
    g.globalCompositeOperation = 'source-over';
  }
}

/* Lumea dulciurilor: cer roz, nori de vata, acadele cat casa si o podea de
   bomboana crapata pe alocuri. Podeaua se deseneaza in coordonatele lumii,
   ca sa se poata rupe exact acolo unde sunt crapaturile. */
function drawCandy(L){
  const sky = g.createLinearGradient(0, 0, 0, L.groundY);
  sky.addColorStop(0, '#FFE6F2'); sky.addColorStop(1, '#FFC9DF');
  g.fillStyle = sky; g.fillRect(0, 0, W, L.groundY);

  /* nori de vata de zahar */
  for(let i = -1; i < 8; i++){
    const x = i*250 - ((cam*0.22) % 250);
    g.fillStyle = i % 2 ? 'rgba(255,255,255,.8)' : 'rgba(255,214,232,.85)';
    puff(g, x + 60, 62 + ((i*53) % 46), 32);
  }

  /* acadele mari, in departare */
  const far = cam * 0.42;
  for(let i = -1; i < 12; i++){
    const x = i*310 - (far % 310);
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 11; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x + 96, L.groundY); g.lineTo(x + 96, 246); g.stroke();
    g.save(); g.translate(x + 96, 208); g.rotate(tick * 0.004 + i);
    for(let k = 0; k < 6; k++){
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 42, k*Math.PI/3, (k+1)*Math.PI/3); g.closePath();
      g.fillStyle = k % 2 ? 'rgba(245,139,176,.8)' : 'rgba(255,255,255,.9)';
      g.fill();
    }
    g.restore();
    g.beginPath(); g.arc(x + 96, 208, 42, 0, 7);
    g.lineWidth = 3; g.strokeStyle = 'rgba(46,36,56,.3)'; g.stroke();
  }
  g.lineCap = 'butt';

  /* jeleuri langa drum */
  const near = cam * 0.72;
  for(let i = -1; i < 16; i++){
    const x = i*225 - (near % 225);
    g.fillStyle = ['rgba(122,201,139,.5)','rgba(255,201,60,.5)','rgba(139,111,214,.42)'][((i%3)+3)%3];
    g.beginPath(); g.moveTo(x, L.groundY);
    g.quadraticCurveTo(x - 4, L.groundY - 58, x + 26, L.groundY - 58);
    g.quadraticCurveTo(x + 56, L.groundY - 58, x + 52, L.groundY);
    g.closePath(); g.fill();
  }

  /* --- podeaua, in coordonatele lumii --- */
  g.save(); g.translate(-cam, 0);
  const x0 = cam - 90, x1 = cam + W + 90;

  /* intunericul de sub lumea dulciurilor — se vede prin crapaturi */
  g.fillStyle = '#3B2A4C'; g.fillRect(x0, L.groundY, x1 - x0, H - L.groundY);
  g.fillStyle = 'rgba(255,255,255,.16)';
  for(let x = Math.floor(x0/37)*37; x < x1; x += 37)
    g.fillRect(x, L.groundY + 26 + ((x*13) % 70), 3, 8);

  /* feliile de podea dintre crapaturi */
  const margini = [x0];
  for(const pt of L.pits)
    if(pt.b > x0 && pt.a < x1 && !pt.pod) margini.push(pt.a, pt.b);
  margini.push(x1);
  for(let i = 0; i + 1 < margini.length; i += 2){
    const a = margini[i], b = margini[i+1];
    if(b <= a) continue;
    g.fillStyle = '#FFF0F6'; g.fillRect(a, L.groundY, b - a, H - L.groundY);
    g.fillStyle = 'rgba(245,163,184,.75)';
    const tile = 56;
    for(let x = Math.floor(a/tile)*tile; x < b; x += tile){
      const xa = Math.max(a, x), xb = Math.min(b, x + tile*0.5);
      if(xb > xa) g.fillRect(xa, L.groundY, xb - xa, H - L.groundY);
    }
    g.fillStyle = INK; g.fillRect(a, L.groundY - 4, b - a, 4);
  }

  /* marginile rupte, puntea, si semnul de atentie deasupra fiecarei crapaturi */
  for(const pt of L.pits){
    if(pt.b < x0 || pt.a > x1) continue;
    if(pt.pod){
      const cols = ['#F2545B','#FFB020','#FFD447','#5FC98B','#4FB3D9','#8B6FD6'];
      for(let k = 0; k < 6; k++){
        g.fillStyle = cols[k];
        g.fillRect(pt.a - 10, L.groundY - 4 + k*4, (pt.b - pt.a) + 20, 4);
      }
      rr(g, pt.a - 10, L.groundY - 5, (pt.b - pt.a) + 20, 26, 5);
      g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
      continue;
    }
    for(const [ex, dir] of [[pt.a, -1], [pt.b, 1]]){
      g.save(); g.translate(ex, L.groundY);
      g.beginPath();
      g.moveTo(0, -2); g.lineTo(-dir*7, 8); g.lineTo(0, 15);
      g.lineTo(-dir*8, 24); g.lineTo(0, 32); g.lineTo(dir*3, 32); g.lineTo(dir*3, -2);
      g.closePath();
      g.fillStyle = '#FFF0F6'; g.fill();
      g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
      g.restore();
    }
    const mx = (pt.a + pt.b)/2;
    g.save(); g.translate(mx, L.groundY - 158 + Math.sin(tick*0.07)*4);
    g.beginPath(); g.moveTo(0,-13); g.lineTo(13,10); g.lineTo(-13,10); g.closePath();
    g.fillStyle = '#FFC93C'; g.fill();
    g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
    g.fillStyle = INK; g.font = '700 13px Fredoka, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('!', 0, 3);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.restore();
  }
  g.restore();
}

function drawBackdrop(L){
  if(L.theme === 'sky')    return drawSky(L);
  if(L.theme === 'candy')  return drawCandy(L);
  if(L.theme === 'forest') return drawForest(L);
  if(L.theme === 'cave')   return drawCave(L);
  if(L.theme === 'water')  return drawWater(L);
  if(L.theme === 'slide')  return drawSlideBg(L);
  if(L.theme === 'pizza')  return drawPizzaRoom(L);
  if(L.theme === 'river')  return drawRiver(L);
  const market = L.theme === 'market';
  const sky = g.createLinearGradient(0,0,0,L.groundY);
  if(market){ sky.addColorStop(0,'#D6F2EA'); sky.addColorStop(1,'#A9DCD1'); }
  else      { sky.addColorStop(0,'#EADDF7'); sky.addColorStop(1,'#CDBBEA'); }
  g.fillStyle = sky; g.fillRect(0,0,W,L.groundY);

  /* lumini de tavan */
  g.fillStyle = market ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.4)';
  for(let x = -((cam*0.5) % 240); x < W+240; x += 240){
    rr(g, x, 16, 96, 12, 6); g.fill();
    g.fillRect(x+44, 0, 8, 16);
  }

  /* strat departat: rafturi / vitrine */
  const far = cam * 0.35;
  for(let i = -1; i < 14; i++){
    const x = i*280 - (far % 280);
    if(market){
      g.fillStyle = 'rgba(255,255,255,.42)';
      rr(g, x, 210, 200, 200, 8); g.fill();
      g.fillStyle = 'rgba(46,36,56,.09)';
      for(let r = 0; r < 4; r++) g.fillRect(x+10, 230 + r*44, 180, 7);
      g.fillStyle = ['rgba(245,110,150,.35)','rgba(95,201,139,.35)','rgba(255,201,60,.4)'][((i%3)+3)%3];
      for(let k = 0; k < 5; k++) rr(g, x+18+k*36, 238+((i+k)%4)*44, 22, 22, 4), g.fill();
    }else{
      g.fillStyle = 'rgba(255,255,255,.45)';
      rr(g, x+20, 190, 220, 220, 10); g.fill();
      g.fillStyle = 'rgba(46,36,56,.12)';
      rr(g, x+48, 250, 74, 160, 6); g.fill();
      rr(g, x+140, 250, 74, 160, 6); g.fill();
      g.fillStyle = ['#F58BB0','#7B5CD6','#5FC98B'][((i%3)+3)%3];
      rr(g, x+38, 206, 184, 22, 6); g.fill();
    }
  }

  /* strat apropiat: plante / cosuri */
  const near = cam * 0.7;
  for(let i = -1; i < 18; i++){
    const x = i*210 - (near % 210);
    g.fillStyle = market ? 'rgba(46,36,56,.14)' : 'rgba(46,36,56,.12)';
    if(market){ rr(g, x, 388, 62, 76, 8); g.fill(); rr(g, x+8, 372, 46, 18, 6); g.fill(); }
    else{
      g.beginPath(); g.ellipse(x+30, 400, 30, 34, 0, 0, 7); g.fill();
      rr(g, x+18, 424, 24, 40, 5); g.fill();
    }
  }

  /* podea */
  g.fillStyle = market ? '#F2E2CD' : '#E9DFF4';
  g.fillRect(0, L.groundY, W, H - L.groundY);
  g.fillStyle = market ? '#E1CBAE' : '#D6C7E8';
  const tile = 64, off = cam % tile;
  for(let x = -off; x < W; x += tile) g.fillRect(x, L.groundY, tile/2, H - L.groundY);
  g.fillStyle = INK; g.fillRect(0, L.groundY - 4, W, 4);
}

function drawCoin(x, y, ph){
  const b = Math.sin(ph) * 3;
  const sq = Math.abs(Math.cos(ph * 0.9));
  g.save(); g.translate(x, y + b);
  g.beginPath(); g.ellipse(0, 0, 9 * (0.35 + sq*0.65), 9, 0, 0, 7);
  g.fillStyle = COIN; g.fill(); g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
  if(sq > 0.45){
    g.beginPath(); g.ellipse(0, 0, 4.4 * sq, 4.4, 0, 0, 7);
    g.strokeStyle = COIND; g.lineWidth = 1.8; g.stroke();
  }
  g.restore();
}

function sparkle(c, x, y, r){
  c.beginPath();
  c.moveTo(x, y-r); c.quadraticCurveTo(x, y, x+r, y);
  c.quadraticCurveTo(x, y, x, y+r); c.quadraticCurveTo(x, y, x-r, y);
  c.quadraticCurveTo(x, y, x, y-r); c.closePath(); c.fill();
}

function drawMushroom(mu, ph){
  const b = Math.sin(ph) * 3;
  g.save(); g.translate(mu.x, mu.y + b);
  g.lineWidth = 2.4; g.strokeStyle = INK; g.lineJoin = 'round';
  /* sclipici in jur */
  g.fillStyle = 'rgba(255,201,60,.85)';
  for(let i = 0; i < 3; i++){
    const a = ph * 1.2 + i * 2.1;
    sparkle(g, Math.cos(a)*20, Math.sin(a)*15 - 6, 3.4);
  }
  rr(g, -7, -6, 14, 15, 4); g.fillStyle = '#FFF0DC'; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-16, -5);
  g.quadraticCurveTo(-16, -22, 0, -22);
  g.quadraticCurveTo(16, -22, 16, -5);
  g.closePath(); g.fillStyle = '#E5566A'; g.fill(); g.stroke();
  g.fillStyle = '#FFF7EC';
  [[-8,-11,3.4],[3,-14,4],[10,-8,2.8]].forEach(d=>{
    g.beginPath(); g.arc(d[0], d[1], d[2], 0, 7); g.fill();
  });
  g.restore();
}

function drawBall(b){
  g.save(); g.translate(b.x, b.y); g.rotate(b.sp);
  g.fillStyle = 'rgba(255,201,60,.45)';
  g.beginPath(); g.arc(0, 0, 11, 0, 7); g.fill();
  g.beginPath(); g.arc(0, 0, 7, 0, 7);
  g.fillStyle = '#F2884B'; g.fill();
  g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
  g.fillStyle = '#FFF3B0';
  g.beginPath(); g.arc(-1.6, -1.6, 2.8, 0, 7); g.fill();
  g.restore();
}

function drawStorm(m){
  g.save(); g.translate(m.x + m.w/2, m.y + m.h/2 + Math.sin(m.t)*3);
  g.lineWidth = 2.4; g.strokeStyle = INK; g.lineJoin = 'round';
  g.fillStyle = '#8E86A8'; puff(g, 0, 0, 34);
  g.fillStyle = '#6F6689'; puff(g, 4, 6, 24);
  g.fillStyle = COIN;
  const f = Math.sin(m.t * 2.4) > 0.2 ? 1 : 0.35;
  g.globalAlpha = f;
  g.beginPath();
  g.moveTo(-5, 12); g.lineTo(6, 12); g.lineTo(0, 22); g.lineTo(10, 20); g.lineTo(-3, 36);
  g.lineTo(1, 24); g.lineTo(-8, 25);
  g.closePath(); g.fill(); g.stroke();
  g.globalAlpha = 1;
  g.fillStyle = '#FFF7EC';
  for(const ex of [-11, 8]){
    g.beginPath(); g.arc(ex, -5, 5, 0, 7); g.fill(); g.stroke();
    g.beginPath(); g.arc(ex + 1.4, -5, 2.1, 0, 7); g.fillStyle = INK; g.fill(); g.fillStyle = '#FFF7EC';
  }
  g.restore();
}

/* Monstrul-jeleu cu mustata din vata de zahar. Ochii se uita dupa fetita,
   iar cand fuge dupa ea i se incrunta sprancenele si i se zbarleste mustata. */
function drawGum(m){
  const pal = [['#E5566A','#FF9DB2'], ['#7B5CD6','#B49AF0'], ['#3BB6A6','#8CE0D3']][m.hue % 3];
  const wob = Math.sin(m.t * 2) * 1.4 - (m.pas || 0);
  g.save(); g.translate(m.x + m.w/2, m.y + m.h/2 + wob);
  g.lineWidth = 2.6; g.strokeStyle = INK; g.lineJoin = 'round';

  /* picioruse de bomboana */
  g.fillStyle = pal[0];
  for(const px of [-15, 8]){
    const ph = 5 + Math.abs(Math.sin(m.t*(m.seek ? 3.4 : 1.8) + (px < 0 ? 0 : 1.6))) * 6;
    rr(g, px, m.h/2 - 5, 7, ph, 3); g.fill(); g.stroke();
  }

  /* corpul de jeleu */
  g.beginPath();
  g.moveTo(-m.w/2 + 4, m.h/2 - 3);
  g.quadraticCurveTo(-m.w/2 + 2, -m.h/2 - 8, 0, -m.h/2 - 8);
  g.quadraticCurveTo(m.w/2 - 2, -m.h/2 - 8, m.w/2 - 4, m.h/2 - 3);
  g.closePath();
  const gr = g.createLinearGradient(0, -m.h/2, 0, m.h/2);
  gr.addColorStop(0, pal[1]); gr.addColorStop(1, pal[0]);
  g.fillStyle = gr; g.fill(); g.stroke();

  /* zahar tos pe jeleu */
  g.fillStyle = 'rgba(255,255,255,.55)';
  for(let i = 0; i < 7; i++)
    g.fillRect(-m.w/2 + 8 + ((i*13) % (m.w - 16)), -m.h/2 + 2 + ((i*17) % (m.h - 6)), 3, 3);

  /* ochii se uita dupa fetita */
  const catre = clamp(((player.x + player.w/2) - (m.x + m.w/2)) / 190, -1, 1);
  for(const ex of [-9, 9]){
    g.beginPath(); g.arc(ex, -11, 6.6, 0, 7);
    g.fillStyle = '#FFF7EC'; g.fill(); g.lineWidth = 2.2; g.stroke();
    g.beginPath(); g.arc(ex + catre*2.8, -11, 2.7, 0, 7); g.fillStyle = INK; g.fill();
  }
  if(m.seek){
    g.lineWidth = 2.6; g.strokeStyle = INK;
    for(const sx of [-1, 1]){
      g.beginPath();
      g.moveTo(sx*4, -20); g.lineTo(sx*14, -16.5); g.stroke();
    }
  }

  /* MUSTATA din vata de zahar */
  const zbarlit = m.seek ? 1.6 : 0;
  for(const sx of [-1, 1]){
    for(const [ox, oy, r] of [[6,0,6.6],[13,-1.4,5.8],[19,0.6,4.6]]){
      g.beginPath();
      g.arc(sx*ox, 2 + oy - Math.sin(m.t*3 + ox)*(0.8 + zbarlit), r, 0, 7);
      g.fillStyle = '#FFC7DC'; g.fill();
      g.lineWidth = 1.4; g.strokeStyle = 'rgba(46,36,56,.4)'; g.stroke();
    }
  }
  g.lineWidth = 2.2; g.strokeStyle = INK;

  /* gurita, sub mustata */
  g.beginPath();
  if(m.seek){ g.arc(0, 9, 4.6, 0, 7); g.fillStyle = DANGER; g.fill(); g.stroke(); }
  else{ g.moveTo(-4, 8); g.quadraticCurveTo(0, 11, 4, 8); g.stroke(); }

  /* cand nu poate trece de o crapatura, se enerveaza */
  if(m.blocat && m.seek && Math.floor(tick/16) % 2){
    g.fillStyle = INK; g.font = '700 15px Fredoka, sans-serif';
    g.textAlign = 'center';
    g.fillText('grr!', 0, -m.h/2 - 14);
    g.textAlign = 'left';
  }
  g.restore();
}

function drawMonster(m){
  if(m.kind === 'storm') return drawStorm(m);
  if(m.kind === 'gum')   return drawGum(m);
  if(m.kind === 'bat')   return drawBat(m);
  if(m.kind === 'jelly') return drawJelly(m);
  if(m.kind === 'croc')  return drawCroc(m);
  const palettes = [['#7B5CD6','#B49AF0'], ['#3BB6A6','#8CE0D3'], ['#F2884B','#FFC08A']];
  const pal = palettes[m.hue % 3];
  const wob = Math.sin(m.t) * 2.4 - (m.pas || 0);
  g.save(); g.translate(m.x + m.w/2, m.y + m.h/2 + wob);
  g.scale(m.dir, 1);
  g.lineWidth = 2.4; g.strokeStyle = INK; g.lineJoin = 'round';

  /* corp lung, dungat */
  rr(g, -m.w/2, -m.h/2, m.w, m.h, 15);
  g.save(); g.clip();
  for(let i = 0; i < 8; i++){
    g.fillStyle = i % 2 ? pal[0] : pal[1];
    g.fillRect(-m.w/2 + i*(m.w/8), -m.h/2, m.w/8 + 1, m.h);
  }
  g.restore();
  rr(g, -m.w/2, -m.h/2, m.w, m.h, 15); g.stroke();

  /* piciorușe */
  g.fillStyle = pal[0];
  for(let i = 0; i < 4; i++){
    const px = -m.w/2 + 10 + i*14;
    const ph = 4 + Math.abs(Math.sin(m.t*1.6 + i)) * 4;
    rr(g, px, m.h/2 - 2, 6, ph, 3); g.fill(); g.stroke();
  }

  /* gura cu tepi */
  g.beginPath(); g.moveTo(m.w/2 - 4, -9);
  g.quadraticCurveTo(m.w/2 + 9, 0, m.w/2 - 4, 9);
  g.closePath(); g.fillStyle = DANGER; g.fill(); g.stroke();
  g.fillStyle = '#FFFFFF';
  for(let i = 0; i < 3; i++){
    const ty = -7 + i*6;
    g.beginPath(); g.moveTo(m.w/2 - 4, ty); g.lineTo(m.w/2 + 2, ty + 2.6); g.lineTo(m.w/2 - 4, ty + 5.2);
    g.closePath(); g.fill();
  }

  /* ochi + antene — ochii se uita dupa fetita, ca la cei din lumea dulciurilor */
  const catre = clamp(((player.x + player.w/2) - (m.x + m.w/2)) * m.dir / 190, -1, 1);
  for(const ex of [-8, 6]){
    g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.moveTo(ex + 3, -m.h/2 + 2); g.lineTo(ex + 5, -m.h/2 - 10); g.stroke();
    g.beginPath(); g.arc(ex + 5, -m.h/2 - 13, 4.5, 0, 7);
    g.fillStyle = '#FFF7EC'; g.fill(); g.lineWidth = 2.2; g.stroke();
    g.beginPath(); g.arc(ex + 5 + catre*1.8, -m.h/2 - 13, 1.9, 0, 7); g.fillStyle = INK; g.fill();
    if(m.seek){
      g.strokeStyle = INK; g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(ex + 1, -m.h/2 - 19); g.lineTo(ex + 9, -m.h/2 - 16.5); g.stroke();
    }
  }
  g.restore();
}

function drawSpikes(s){
  for(let i = 0; i < s.n; i++){
    const x = s.x + i*24;
    g.beginPath(); g.moveTo(x, s.y + s.h); g.lineTo(x + 12, s.y); g.lineTo(x + 24, s.y + s.h);
    g.closePath();
    g.fillStyle = DANGER; g.fill();
    g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
    g.beginPath(); g.moveTo(x + 12, s.y); g.lineTo(x + 17, s.y + 11); g.lineTo(x + 12, s.y + 9);
    g.closePath(); g.fillStyle = 'rgba(255,255,255,.5)'; g.fill();
  }
}

function drawGoal(L){
  const x = L.goalX, y = L.groundY;
  g.lineWidth = 2.6; g.strokeStyle = INK;
  rr(g, x - 20, y - 190, 180, 190, 12); g.fillStyle = '#FFF7EC'; g.fill(); g.stroke();
  rr(g, x - 26, y - 216, 192, 34, 10); g.fillStyle = COIN; g.fill(); g.stroke();
  g.fillStyle = INK; g.font = '700 20px Fredoka, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(L.goalLabel, x + 70, y - 198);
  rr(g, x + 40, y - 120, 60, 120, 8); g.fillStyle = L.theme === 'market' ? '#F58BB0' : '#7B5CD6'; g.fill(); g.stroke();
  g.beginPath(); g.arc(x + 88, y - 60, 4, 0, 7); g.fillStyle = COIN; g.fill(); g.stroke();
  rr(g, x - 6, y - 132, 38, 84, 6); g.fillStyle = '#BFE7DE'; g.fill(); g.stroke();
  rr(g, x + 108, y - 132, 38, 84, 6); g.fill(); g.stroke();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

function drawCastle(L){
  const cy = L.castleY, cx = 480;
  g.save();
  g.fillStyle = 'rgba(255,255,255,.92)';
  puff(g, cx - 130, cy + 96, 68); puff(g, cx + 130, cy + 96, 72); puff(g, cx, cy + 104, 92);
  g.lineWidth = 2.8; g.strokeStyle = INK; g.lineJoin = 'round';

  const tower = (tx, tw, th, roof) => {
    rr(g, tx - tw/2, cy + 60 - th, tw, th, 5);
    g.fillStyle = '#FFF7EC'; g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(tx - tw/2 - 7, cy + 60 - th);
    g.lineTo(tx, cy + 60 - th - roof);
    g.lineTo(tx + tw/2 + 7, cy + 60 - th);
    g.closePath(); g.fillStyle = '#F58BB0'; g.fill(); g.stroke();
    g.beginPath(); g.arc(tx, cy + 84 - th, 9, Math.PI, 0); g.lineTo(tx + 9, cy + 96 - th);
    g.lineTo(tx - 9, cy + 96 - th); g.closePath();
    g.fillStyle = '#7B5CD6'; g.fill(); g.stroke();
  };
  tower(cx - 96, 56, 116, 46);
  tower(cx + 96, 56, 116, 46);
  tower(cx, 88, 168, 62);

  /* steag */
  g.beginPath(); g.moveTo(cx, cy - 170); g.lineTo(cx, cy - 200); g.stroke();
  g.beginPath(); g.moveTo(cx, cy - 200); g.lineTo(cx + 34, cy - 191); g.lineTo(cx, cy - 182);
  g.closePath(); g.fillStyle = COIN; g.fill(); g.stroke();

  /* poarta */
  g.beginPath(); g.arc(cx, cy + 28, 20, Math.PI, 0); g.lineTo(cx + 20, cy + 60);
  g.lineTo(cx - 20, cy + 60); g.closePath();
  g.fillStyle = '#B98BE0'; g.fill(); g.stroke();

  g.fillStyle = INK; g.font = '700 22px Fredoka, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('CASTELUL PRINȚESEI', cx, cy + 128);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.restore();
}

function drawHUD(L){
  /* inimi */
  for(let i = 0; i < 3; i++){
    const x = 22 + i*32, y = 26, on = i < player.hearts;
    g.save(); g.translate(x, y); g.scale(1.05, 1.05);
    g.beginPath();
    g.moveTo(0, 5);
    g.bezierCurveTo(-11, -5, -6, -13, 0, -7);
    g.bezierCurveTo(6, -13, 11, -5, 0, 5);
    g.closePath();
    g.fillStyle = on ? '#F2545B' : 'rgba(255,255,255,.42)'; g.fill();
    g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
    g.restore();
  }
  /* cate bucati a strans */
  if(L.bitsNeeded){
    for(let i = 0; i < L.bitsNeeded; i++){
      g.save(); g.translate(28 + i*30, 66);
      const on = i < bitsGot;
      if(L.bitKind === 'ingredient'){
        g.beginPath(); g.arc(0, 0, 10, 0, 7);
        g.fillStyle = on ? '#E5566A' : 'rgba(255,255,255,.28)'; g.fill();
      }else{
        g.rotate(-0.35); rr(g, -12, -3, 24, 6, 3);
        g.fillStyle = on ? '#C68B52' : 'rgba(255,255,255,.28)'; g.fill();
      }
      g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
      g.restore();
    }
  }

  /* sageata catre ce a ramas de strans — bucata sau cocoș */
  let want = null, wantKind = null;
  if(L.bitsNeeded && bitsGot < L.bitsNeeded)              wantKind = L.bitKind;
  else if(L.roostersNeeded && roostersGot < L.roostersNeeded && L.baked) wantKind = 'rooster';
  if(wantKind){
    const pool = wantKind === 'rooster' ? L.roosters : L.bits;
    let best = null, bd = 1e9;
    for(const b of pool){
      if(wantKind === 'rooster' ? b.follow : b.got) continue;
      const d = Math.abs(b.x - (player.x + player.w/2));
      if(d < bd){ bd = d; best = b; }
    }
    want = best;
    if(want && (want.x < cam + 60 || want.x > cam + W - 60)){
      const best = want, rightSide = best.x > player.x;
      const ax = rightSide ? W - 46 : 46, ay = H/2 + Math.sin(tick*0.06)*8;
      g.save(); g.translate(ax, ay); g.scale(rightSide ? 1 : -1, 1);
      g.beginPath(); g.moveTo(-14, -14); g.lineTo(14, 0); g.lineTo(-14, 14); g.closePath();
      g.fillStyle = 'rgba(255,201,60,.9)'; g.fill();
      g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
      g.restore();
      g.save(); g.translate(ax, ay + 30);
      if(wantKind === 'rooster'){
        g.beginPath(); g.ellipse(0, 2, 9, 8, 0, 0, 7); g.fillStyle = '#FFF7EC'; g.fill();
        g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
        g.beginPath(); g.moveTo(-4, -6); g.lineTo(0, -13); g.lineTo(4, -6); g.closePath();
        g.fillStyle = '#E5566A'; g.fill(); g.stroke();
      }else if(wantKind === 'ingredient'){
        g.beginPath(); g.arc(0, 0, 10, 0, 7); g.fillStyle = '#E5566A'; g.fill();
        g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
      }else{
        g.rotate(-0.35); rr(g, -13, -3, 26, 6, 3); g.fillStyle = '#C68B52'; g.fill();
        g.lineWidth = 2.2; g.strokeStyle = INK; g.stroke();
      }
      g.restore();
    }
  }

  /* punga cu banuti */
  g.save();
  rr(g, W - 132, 12, 112, 34, 17);
  g.fillStyle = 'rgba(255,247,236,.94)'; g.fill();
  g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
  drawCoin(W - 108, 29, tick * 0.07);
  g.fillStyle = INK; g.font = '600 21px Fredoka, sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(String(purse), W - 90, 30);
  g.restore();
  /* bara de SUPER */
  if(player.superT > 0){
    const bw = 112, bx = W - 132, by = 52;
    rr(g, bx, by, bw, 16, 8); g.fillStyle = 'rgba(255,247,236,.94)'; g.fill();
    g.lineWidth = 2.4; g.strokeStyle = INK; g.stroke();
    const frac = clamp(player.superT / (60*22), 0, 1);
    rr(g, bx + 3, by + 3, Math.max(8, (bw - 6) * frac), 10, 5);
    g.fillStyle = '#E5566A'; g.fill();
    g.fillStyle = INK; g.font = '600 11px Fredoka, sans-serif';
    g.textAlign = 'right'; g.textBaseline = 'middle';
    g.fillText('SUPER', bx - 6, by + 8);
    g.textAlign = 'left';
  }

  /* eticheta nivelului */
  g.save();
  const darkBg = L.theme === 'cave' || L.theme === 'water';
  g.fillStyle = darkBg ? 'rgba(255,247,236,.8)' : 'rgba(46,36,56,.55)';
  g.font = '500 15px Fredoka, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.fillText(L.name + ' · ' + L.sub, W/2, 16);
  /* bara de progres */
  const pw = 190, px = (W - pw)/2, py = 38;
  rr(g, px, py, pw, 7, 4); g.fillStyle = darkBg ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.55)'; g.fill();
  const prog = L.mode === 'fly'
    ? clamp((L.startY - player.y) / (L.startY - L.castleY), 0, 1)
    : clamp(player.x / (L.goalX || L.len), 0, 1);
  rr(g, px, py, Math.max(7, pw*prog), 7, 4); g.fillStyle = '#7B5CD6'; g.fill();
  g.restore();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

  if(fpsShow){
    const txt = fpsVal + ' cadre/s · ' + stepsPerSec + ' pași/s · ' +
                (navigator.serviceWorker && navigator.serviceWorker.controller ? 'salvat local' : 'de la server');
    g.save();
    g.font = '600 14px Fredoka, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
    const w = g.measureText(txt).width + 20;
    rr(g, 16, H - 34, w, 24, 12);
    g.fillStyle = 'rgba(255,247,236,.92)'; g.fill();
    g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
    g.fillStyle = INK; g.fillText(txt, 26, H - 22);
    g.restore();
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  }
}

/* Sub apa torța sta in rucsac — o refolosim, nu o construim la fiecare cadru. */
let _swimLook = null;
function swimLook(){
  if(!_swimLook) _swimLook = {};
  for(const k in look) _swimLook[k] = look[k];
  _swimLook.torch = false;
  return _swimLook;
}

function render(){
  const L = LEVELS[levelIdx];
  g.clearRect(0,0,W,H);
  drawBackdrop(L);

  g.save();
  const sx = shakeT > 0 ? (Math.random()-.5) * shakeT * 0.5 : 0;
  const sy = shakeT > 0 ? (Math.random()-.5) * shakeT * 0.5 : 0;
  g.translate(-cam + sx, -camY + sy);

  if(L.mode === 'fly')            drawCastle(L);
  else if(L.theme === 'cave')     { drawFire(L, bitsGot >= L.bitsNeeded); if(L.collapsed) drawRocks(L); }
  else if(L.theme === 'water')    drawTurtle(L);
  else if(L.mode === 'slide')     drawSlide(L);
  else if(L.mode === 'surf')      { /* raul e desenat in fundal */ }
  else                            drawGoal(L);
  if(L.ovenX) drawOven(L, L.baked);
  for(const r of L.roosters) if(r.x > cam - 80 && r.x < cam + W + 80) drawRooster(r);
  if(L.theme === 'water' || L.theme === 'river') drawBubbles();
  for(const b of L.bits) if(b.x > cam - 60 && b.x < cam + W + 60) drawBit(b, tick*0.05 + b.x*0.01, L.bitKind);

  for(const pl of L.platforms){
    if(pl.x + pl.w < cam - 60 || pl.x > cam + W + 60) continue;
    rr(g, pl.x, pl.y, pl.w, pl.h, 7);
    g.fillStyle = L.theme === 'market' ? '#F7E4CC' : L.theme === 'forest' ? '#E9F5DA'
                : L.theme === 'cave'   ? '#6A5A8E' : L.theme === 'river' ? '#C79A63'
                : L.theme === 'pizza'  ? '#F3D9B8' : L.theme === 'candy' ? '#FFE3EF'
                : '#FFF0F6'; g.fill();
    g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke();
    rr(g, pl.x + 6, pl.y + pl.h, pl.w - 12, 10, 4);
    g.fillStyle = 'rgba(46,36,56,.18)'; g.fill();
  }
  for(const s of L.spikes){ if(s.x < cam + W + 60 && s.x + s.w > cam - 60) drawSpikes(s); }
  for(const c of L.coins){ if(!c.got && c.x > cam - 40 && c.x < cam + W + 40) drawCoin(c.x, c.y, tick*0.08 + c.x*0.02); }
  for(const m of L.monsters){ if(!m.dead && m.x < cam + W + 90 && m.x + m.w > cam - 90) drawMonster(m); }
  for(const mu of L.mushrooms){ if(!mu.got && mu.x > cam - 60 && mu.x < cam + W + 60) drawMushroom(mu, tick*0.06 + mu.x*0.01); }
  for(const b of balls) drawBall(b);
  if(L.mode === 'fly'){
    /* norul de pornire, ca sa aiba de unde sa isi ia zborul */
    g.fillStyle = 'rgba(255,255,255,.9)';
    puff(g, 90, L.startY + 78, 54); puff(g, 200, L.startY + 86, 44);
  }

  /* fetita */
  const p = player;
  if(p.superT > 0){
    const fade = p.superT < 150 && Math.floor(tick/5) % 2 ? 0.25 : 1;
    g.save();
    const cx = p.x + p.w/2, cy = p.y + p.h/2;
    for(let i = 0; i < 7; i++){
      const a = tick*0.055 + i*(Math.PI*2/7);
      g.globalAlpha = fade * (0.5 + Math.sin(tick*0.11 + i) * 0.35);
      g.fillStyle = i % 2 ? '#FFC93C' : '#FFF3B0';
      sparkle(g, cx + Math.cos(a)*27, cy + Math.sin(a)*33, 5);
    }
    g.restore();
  }
  if(!(p.invuln > 0 && Math.floor(tick/4) % 2)){
    if(L.mode === 'surf'){
      /* fetita pe porc, porcul pe placa, placa pe val */
      const cx = p.x + p.w/2, base = p.y + p.h;
      const tilt = Math.sin(tick * 0.06) * 0.06;
      drawBoard(cx, base + 6, tilt);
      g.save(); g.translate(cx, base - 2); g.rotate(tilt); g.translate(-cx, -(base - 2));
      drawPig(g, look.pig, { x: cx - 4, y: base - 24, scale: 0.62, face: 1 });
      drawGirl(g, look, {
        side: PROFIL_IN_JOC,
        x: cx + 2, y: base - 42, face: 1, scale: 0.8,
        legs: 0.9, arms: tick * 0.12, sup: p.superT > 0, wing: tick * 0.3,
        mood: p.mood, speed: 4, blink: tick > p.blinkAt - 7 && tick < p.blinkAt
      });
      g.restore();
    }else{
      /* cand sta pe loc, respira si face cu mana din cand in cand */
      const stand = p.idleT > 90 && p.mood === 'ok';
      const wave  = stand && (p.idleT % 200) < 46;
      drawGirl(g, (L.mode === 'swim' && look.torch) ? swimLook() : look, {
        side: PROFIL_IN_JOC,
        x: p.x + p.w/2, y: p.y + p.h + 4,
        face: p.face, scale: 0.92 + (stand ? Math.sin(tick*0.06)*0.008 : 0),
        legs: p.onGround ? p.walk : 1.1,
        arms: wave ? tick * 0.34 : (p.onGround ? p.walk : -1.4),
        sup: p.superT > 0,
        speed: p.vx,
        mood: p.mood,
        squash: p.squashT > 0 ? p.squashT / 11 : 0,
        blink: tick > p.blinkAt - 7 && tick < p.blinkAt,
        wing: L.mode === 'fly' ? tick * 0.55 : p.walk
      });
    }
  }

  for(const q of pops){
    g.save();
    g.globalAlpha = clamp(q.t/34, 0, 1);
    g.font = '700 19px Fredoka, sans-serif'; g.textAlign = 'center';
    g.lineWidth = 4; g.strokeStyle = '#FFF7EC'; g.strokeText(q.txt, q.x, q.y);
    g.fillStyle = q.col; g.fillText(q.txt, q.x, q.y);
    g.restore();
  }
  g.restore();

  if(L.theme === 'cave') drawDark(L);
  drawHUD(L);
}

/* ---------------- alegerea nivelului ---------------- */
const LEVEL_EMOJI = ['🛒','🛍️','🌲','☁️','🦇','🐢','🛝','🍕','🐊','🍭'];

/* Cand sari direct la un nivel, ii dam ce ar fi trebuit sa aiba pana acolo:
   aripi de la vrajitor, torta de la foc, porcul de la cocosi. */
function setupLookFor(i){
  look.fairy = i >= 3;
  look.torch = i >= 5 && i <= 8;
  look.pizza = false;
  look.arma  = null;   /* arma se ia abia la capatul lumii dulciurilor */
  if(i >= 8 && !owned[look.pig]) look.pig = 'porcRoz';
}

function showLevels(fromIntro){
  state = STATE.LEVELS;
  const cards = LEVELS.map((L, i) =>
    '<button class="lvl" type="button" data-lvl="' + i + '">' +
      '<span class="em">' + LEVEL_EMOJI[i] + '</span>' +
      '<span class="no">' + (i + 1) + '</span>' +
      '<span class="nm">' + L.sub + '</span>' +
    '</button>').join('');
  openPanel(
    '<p class="eyebrow">Alege de unde începi</p>' +
    '<h2>Nivelurile</h2>' +
    '<div class="levels">' + cards + '</div>' +
    '<button class="btn" id="inapoi" type="button">' +
      (fromIntro ? 'De la început, cu povestea ↩' : 'Înapoi la joacă ↩') + '</button>' +
    '<p class="tiny">Toate nivelurile merg cu aceeași viteză. Apasă <b>P</b> ca să vezi cât de repede merge jocul.</p>'
  );
  card.querySelectorAll('.lvl').forEach(el => {
    el.onclick = () => {
      const i = Number(el.getAttribute('data-lvl'));
      setupLookFor(i);
      if(purse < 60) purse = 60;   /* ca sa poata proba hainutele si aici */
      startLevel(i);
    };
  });
  document.getElementById('inapoi').onclick = () => {
    if(fromIntro) showIntro();
    else { closePanel(); state = STATE.PLAY; }
  };
}

function itemCard(item, kind){
  const worn   = look[kind] === item.id;
  const has    = !!owned[item.id];
  const afford = has || purse >= item.price;
  const st     = worn ? 'worn' : (afford ? 'ok' : 'locked');
  const label  = worn ? (kind === 'pig' ? 'Ales' : kind === 'arma' ? 'Aleasă' : 'Purtată') : (has ? 'Ai deja' : item.price + ' <svg class="coin-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.4" fill="#FFC93C" stroke="#2E2438" stroke-width="2"/><circle cx="10" cy="10" r="3.9" fill="none" stroke="#E39B12" stroke-width="1.8"/></svg>');
  return '<button class="item" type="button" data-state="' + st + '" data-kind="' + kind + '" data-id="' + item.id + '"' +
         (st === 'locked' ? ' disabled' : '') + '>' +
         '<canvas width="130" height="160" data-prev="' + kind + ':' + item.id + '"></canvas>' +
         '<span class="nm">' + item.name + '</span>' +
         '<span class="pr">' + label + '</span></button>';
}

function paintPreviews(){
  card.querySelectorAll('canvas[data-prev]').forEach(el => {
    const parts = el.getAttribute('data-prev').split(':');
    const prev = { outfit:look.outfit, hair:look.hair, makeup:look.makeup,
                   wings:look.wings, fairy:look.fairy, arma:look.arma };
    prev[parts[0]] = parts[1];
    if(parts[0] === 'wings') prev.fairy = true;
    const c = el.getContext('2d');
    c.clearRect(0,0,130,160);
    c.fillStyle = 'rgba(255,255,255,.55)';
    rr(c, 8, 8, 114, 144, 10); c.fill();
    if(parts[0] === 'pig') drawPig(c, parts[1], { x:61, y:96, scale:0.72, face:1 });
    else                   drawGirl(c, prev, { x:65, y:150, scale:1.9, face:1 });
  });
}

function wireShop(){
  card.querySelectorAll('.item').forEach(el => {
    el.onclick = () => {
      const kind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
      const list = kind === 'outfit' ? OUTFITS : kind === 'hair' ? HAIRS
                 : kind === 'wings'  ? WINGS   : kind === 'pig' ? PIGS
                 : kind === 'arma'   ? ARME    : MAKEUPS;
      const item = byId(list, id);
      if(!owned[id]){
        if(purse < item.price) return;
        purse -= item.price; owned[id] = true; sfx.buy();
      }
      look[kind] = id;

  (LEVELS[i].pits || []).forEach(p => { p.caderi = 0; p.pod = false; });
  LEVELS[i].bits.forEach(b => b.got = false);

/* ---------------- bucla ----------------
   Fizica avanseaza in pasi ficsi de 1/60 de secunda, nu o data pe cadru.
   Altfel viteza jocului e legata de ecran: pe un laptop la 120 Hz merge de
   doua ori mai repede decat pe un telefon la 60, si aceeasi fila mutata in
   fundal (unde Chrome incetineste cadrele) pare ca se blocheaza. */
const STEP_MS = 1000 / 60;
let acc = 0, lastFrame = 0;
let fpsShow = false, fpsSamples = [], fpsVal = 0, stepsPerSec = 0, stepCount = 0, stepWindow = 0;

function loop(now){
  if(now === undefined) now = performance.now();
  if(!lastFrame) lastFrame = now;
  let dt = now - lastFrame;
  lastFrame = now;
  /* dupa o pauza (fila in fundal, capac inchis) nu recuperam un minut dintr-o data */
  if(dt > 250) dt = 250;
  if(dt < 0) dt = 0;

  fpsSamples.push(dt);
  if(fpsSamples.length > 40) fpsSamples.shift();

  acc += dt;
  let steps = 0;
  while(acc >= STEP_MS && steps < 5){
    tick++;
    if(state === STATE.PLAY) step();
    acc -= STEP_MS;
    steps++;
  }
  stepCount += steps; stepWindow += dt;
  if(stepWindow >= 500){
    stepsPerSec = Math.round(stepCount * 1000 / stepWindow);
    const sorted = fpsSamples.slice().sort((a,b) => a-b);
    const med = sorted[Math.floor(sorted.length/2)] || 0;
    fpsVal = med > 0 ? Math.round(1000/med) : 0;
    stepCount = 0; stepWindow = 0;
  }

  /* Nu redesenam de doua ori aceeasi stare pe un ecran la 120 Hz. */
  if(steps > 0 || fpsShow) render();
  requestAnimationFrame(loop);
}

/* ---------------- butoane bara ---------------- */

<script>
(function(){
  "use strict";

  /* service worker — face jocul sa mearga si fara internet */
  if('serviceWorker' in navigator){
    addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.warn('[pwa] service worker neinregistrat:', e && e.message);
      });
    });
  }

  /* sfatul de instalare: doar pe iPhone/iPad, in Safari, si doar o data */
  var esteIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var caAplicatie = navigator.standalone === true ||
                    matchMedia('(display-mode: standalone)').matches;
  var refuzat = false;
  try { refuzat = localStorage.getItem('anabelle-instalare') === 'nu'; } catch(e){}

  if(esteIOS && !caAplicatie && !refuzat){
    var el = document.getElementById('instaleaza');
    el.style.display = 'flex';
    document.getElementById('instaleaza-nu').onclick = function(){
      el.style.display = 'none';
      try { localStorage.setItem('anabelle-instalare', 'nu'); } catch(e){}
    };
  }
})();
</script>
